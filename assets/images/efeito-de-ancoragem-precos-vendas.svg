<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Efeito de ancoragem em preços e vendas</title><desc id="d">Ilustração mostrando um preço de referência alto influenciando a percepção de um preço seguinte.</desc><rect width="1200" height="630" fill="#101010"/><rect x="52" y="50" width="1096" height="530" rx="34" fill="#171717" stroke="#333"/><text x="96" y="128" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#f4f0e8">EFEITO DE ANCORAGEM</text><text x="96" y="174" font-family="Arial,sans-serif" font-size="24" fill="#d1a447">o primeiro preço vira referência para o próximo</text><rect x="110" y="235" width="330" height="180" rx="26" fill="#252525" stroke="#555"/><text x="145" y="282" font-family="Arial,sans-serif" font-size="20" fill="#bbb">PRIMEIRA REFERÊNCIA</text><text x="145" y="355" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#fff">R$ 297</text><path d="M470 325 H690" stroke="#d1a447" stroke-width="10" stroke-linecap="round"/><path d="M660 294 L700 325 L660 356" fill="none" stroke="#d1a447" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><rect x="735" y="235" width="330" height="180" rx="26" fill="#211414" stroke="#a51f27"/><text x="770" y="282" font-family="Arial,sans-serif" font-size="20" fill="#bbb">PREÇO SEGUINTE</text><text x="770" y="355" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#fff">R$ 97</text><text x="118" y="482" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">O produto não mudou. O ponto de comparação mudou.</text><text x="118" y="520" font-family="Arial,sans-serif" font-size="18" fill="#c7c0b8">Boa ancoragem organiza valor; ancoragem falsa destrói confiança.</text><rect x="96" y="548" width="250" height="6" rx="3" fill="#a51f27"/><rect x="346" y="548" width="170" height="6" rx="3" fill="#e25c2d"/><rect x="516" y="548" width="120" height="6" rx="3" fill="#d1a447"/></svg>