<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Dark patterns no marketing digital</title><desc id="d">Ilustração com exemplos de urgência falsa, taxa escondida, opção pré-selecionada e cancelamento difícil.</desc><rect width="1200" height="630" fill="#101010"/><rect x="48" y="48" width="1104" height="534" rx="34" fill="#171717" stroke="#343434"/><text x="92" y="130" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#f4f0e8">DARK PATTERNS</text><text x="92" y="176" font-family="Arial, sans-serif" font-size="24" fill="#d1a447">quando a interface deixa de persuadir e começa a manipular</text><g font-family="Arial, sans-serif"><rect x="92" y="226" width="235" height="138" rx="22" fill="#232323"/><text x="116" y="268" font-size="21" font-weight="700" fill="#fff">⏱ Urgência falsa</text><text x="116" y="307" font-size="18" fill="#bbb">“Só 04:59”</text><text x="116" y="338" font-size="15" fill="#e25c2d">reinicia ao atualizar</text><rect x="347" y="226" width="235" height="138" rx="22" fill="#232323"/><text x="371" y="268" font-size="21" font-weight="700" fill="#fff">+ Taxa escondida</text><text x="371" y="307" font-size="18" fill="#bbb">Preço na vitrine</text><text x="371" y="338" font-size="15" fill="#e25c2d">custo extra no final</text><rect x="602" y="226" width="235" height="138" rx="22" fill="#232323"/><text x="626" y="268" font-size="21" font-weight="700" fill="#fff">☑ Pré-seleção</text><text x="626" y="307" font-size="18" fill="#bbb">Extra já marcado</text><text x="626" y="338" font-size="15" fill="#e25c2d">inércia vira consentimento</text><rect x="857" y="226" width="235" height="138" rx="22" fill="#232323"/><text x="881" y="268" font-size="21" font-weight="700" fill="#fff">↩ Cancelamento</text><text x="881" y="307" font-size="18" fill="#bbb">Entrar: 2 cliques</text><text x="881" y="338" font-size="15" fill="#e25c2d">Sair: um labirinto</text><rect x="92" y="403" width="1000" height="105" rx="24" fill="#211414" stroke="#a51f27"/><text x="120" y="447" font-size="23" font-weight="700" fill="#fff">Persuasão forte continua funcionando depois que o cliente entende o mecanismo.</text><text x="120" y="480" font-size="18" fill="#d1c6bd">Se a técnica depende de confusão, ocultação ou pressão falsa, ela não melhora a decisão — ela distorce a decisão.</text></g><rect x="92" y="532" width="260" height="6" rx="3" fill="#a51f27"/><rect x="352" y="532" width="180" height="6" rx="3" fill="#e25c2d"/><rect x="532" y="532" width="120" height="6" rx="3" fill="#d1a447"/></svg>