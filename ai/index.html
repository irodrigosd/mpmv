<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPMV AI</title><meta name="description" content="MPMV AI — seu assistente de inteligência artificial.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6fbff;color:#10243e}body{min-height:100vh}.top{height:64px;border-bottom:1px solid #dceaf5;background:#fff;display:flex;align-items:center;padding:0 22px;justify-content:space-between}.brand{font-weight:800;font-size:20px;color:#159bd3}.brand span{color:#10243e}.status{font-size:12px;color:#6b7d90}.main{width:min(1000px,100%);margin:0 auto;min-height:calc(100vh - 64px);display:flex;flex-direction:column;padding:32px 18px 20px}.hero{text-align:center;margin:35px 0 28px}.hero h1{font-size:36px;margin:0 0 10px}.hero p{margin:0;color:#65788c}.messages{flex:1;display:flex;flex-direction:column;gap:16px}.empty{margin:auto;text-align:center;color:#6b7d90}.bubble{max-width:82%;padding:15px 17px;border-radius:18px;line-height:1.55;white-space:pre-wrap}.user{align-self:flex-end;background:#159bd3;color:#fff;border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:#fff;border:1px solid #dceaf5;border-bottom-left-radius:5px}.composer{position:sticky;bottom:0;background:#f6fbff;padding:16px 0 5px}.box{background:#fff;border:1px solid #cfe0ec;border-radius:18px;padding:10px;display:flex;gap:10px;box-shadow:0 5px 20px #173a5312}.box textarea{resize:none;border:0;outline:0;flex:1;min-height:52px;padding:8px;background:transparent}.send{border:0;border-radius:12px;background:#159bd3;color:#fff;padding:0 20px;font-weight:700;cursor:pointer}.send:disabled{opacity:.5}.hint{text-align:center;color:#8a99a8;font-size:11px;margin-top:8px}@media(max-width:600px){.hero h1{font-size:28px}.bubble{max-width:92%}.main{padding-top:15px}.status{display:none}}
</style></head>
<body><header class="top"><div class="brand">MPMV <span>AI</span></div><div class="status">Seu assistente de IA</div></header>
<main class="main"><section class="hero"><h1>Como posso ajudar?</h1><p>Converse, crie, analise e resolva.</p></section><section id="messages" class="messages"><div class="empty">Comece uma conversa abaixo.</div></section>
<form id="form" class="composer"><div class="box"><textarea id="input" placeholder="Digite sua mensagem..." autocomplete="off"></textarea><button id="send" class="send">Enviar</button></div><div class="hint">Enter envia • Shift + Enter quebra linha</div></form></main>
<script>
const form=document.getElementById('form'),input=document.getElementById('input'),messages=document.getElementById('messages'),send=document.getElementById('send');let history=[];
function add(role,text){const empty=messages.querySelector('.empty');if(empty)empty.remove();const el=document.createElement('div');el.className='bubble '+role;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight}
async function submit(){const text=input.value.trim();if(!text||send.disabled)return;input.value='';add('user',text);history.push({role:'user',content:text});send.disabled=true;send.textContent='...';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const d=await r.json();const answer=d.message||d.error||'Não foi possível responder agora.';add('assistant',answer);history.push({role:'assistant',content:answer})}catch(e){add('assistant','Erro de conexão. Tente novamente.')}finally{send.disabled=false;send.textContent='Enviar';input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();submit()});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});
</script></body></html>
