<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="t d"><title id="t">Atenção antes da venda</title><desc id="d">Uma sequência visual mostra atenção, percepção e decisão.</desc><rect width="1400" height="700" rx="28" fill="#eaf7ff"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#8bcbe9" stroke-width="4"><rect x="90" y="205" width="320" height="260" rx="28"/><rect x="540" y="205" width="320" height="260" rx="28"/><rect x="990" y="205" width="320" height="260" rx="28"/></g><g fill="#0b5f91"><text x="250" y="275" font-size="28" font-weight="700">1. ATENÇÃO</text><text x="700" y="275" font-size="28" font-weight="700">2. PERCEPÇÃO</text><text x="1150" y="275" font-size="28" font-weight="700">3. DECISÃO</text></g><g fill="#3f5666" font-size="22"><text x="250" y="330">A pessoa percebe</text><text x="250" y="365">que existe uma mensagem.</text><text x="700" y="330">Ela entende por que</text><text x="700" y="365">aquilo importa para ela.</text><text x="1150" y="330">Só então existe espaço</text><text x="1150" y="365">para escolher.</text></g><g fill="none" stroke="#1e9bd7" stroke-width="8"><path d="M420 335h95"/><path d="M870 335h95"/></g><g fill="#1e9bd7"><path d="M505 335l-28-18v36z"/><path d="M955 335l-28-18v36z"/></g></g></svg>