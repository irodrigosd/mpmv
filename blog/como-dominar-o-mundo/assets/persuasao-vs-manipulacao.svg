<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="t d"><title id="t">Persuasão versus manipulação</title><desc id="d">Comparação visual entre uma decisão baseada em clareza e uma ação baseada em engano.</desc><rect width="1400" height="700" rx="28" fill="#f7fbfd"/><rect x="70" y="90" width="580" height="520" rx="30" fill="#e7f6ff" stroke="#8bcbe9" stroke-width="4"/><rect x="750" y="90" width="580" height="520" rx="30" fill="#fff1f1" stroke="#e4a1a1" stroke-width="4"/><g font-family="Arial,sans-serif"><text x="360" y="160" text-anchor="middle" fill="#0b5f91" font-size="34" font-weight="700">PERSUASÃO</text><text x="1040" y="160" text-anchor="middle" fill="#9a3434" font-size="34" font-weight="700">MANIPULAÇÃO</text><g fill="#3f5666" font-size="24"><text x="130" y="235">• argumentos legítimos</text><text x="130" y="290">• prova que sustenta a promessa</text><text x="130" y="345">• clareza para decidir</text><text x="130" y="400">• autonomia do consumidor</text><text x="130" y="455">• valor depois da compra</text><text x="810" y="235">• engano ou dissimulação</text><text x="810" y="290">• promessa sem sustentação</text><text x="810" y="345">• pressão para acelerar</text><text x="810" y="400">• perda de autonomia</text><text x="810" y="455">• arrependimento depois</text></g></g></svg>