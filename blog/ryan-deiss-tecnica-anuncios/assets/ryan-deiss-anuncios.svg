<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Ryan Deiss: de US$ 8,2 milhões em anúncios a US$ 54 milhões em receita</title>
  <desc id="desc">Capa editorial do Projeto Gigantes do Marketing com as etapas mensagem, conteúdo e segmentação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070707"/><stop offset="0.64" stop-color="#17120f"/><stop offset="1" stop-color="#2a0d11"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2d27e"/><stop offset="0.58" stop-color="#c18a2d"/><stop offset="1" stop-color="#8c5616"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="1060" cy="100" r="240" fill="#c99c3d" opacity=".08"/>
  <circle cx="1020" cy="720" r="310" fill="#a51f27" opacity=".12"/>
  <path d="M0 690 C260 590 430 770 700 650 C880 570 1010 600 1200 530 L1200 800 L0 800Z" fill="#090909" opacity=".55"/>
  <text x="76" y="92" fill="#d6b35f" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="5">PROJETO GIGANTES DO MARKETING</text>
  <rect x="76" y="122" width="184" height="6" rx="3" fill="url(#gold)"/>
  <text x="76" y="244" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900" letter-spacing="-3">RYAN DEISS</text>
  <text x="76" y="318" fill="#c8c0b7" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="600">A técnica por trás dos números</text>
  <g filter="url(#shadow)">
    <rect x="76" y="372" width="446" height="168" rx="28" fill="#11100f" stroke="#3b3328"/>
    <text x="112" y="426" fill="#9f978e" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">MÍDIA</text>
    <text x="112" y="502" fill="url(#gold)" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="950">US$ 8,2 MI</text>
    <rect x="554" y="372" width="570" height="168" rx="28" fill="#11100f" stroke="#3b3328"/>
    <text x="590" y="426" fill="#9f978e" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">RECEITA DECLARADA</text>
    <text x="590" y="502" fill="url(#gold)" font-family="Inter,Arial,sans-serif" font-size="64" font-weight="950">US$ 54 MI</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-weight="800" text-anchor="middle">
    <rect x="76" y="602" width="310" height="104" rx="20" fill="#1b1714" stroke="#564529"/>
    <text x="231" y="646" fill="#d8b45f" font-size="18" letter-spacing="2">01</text><text x="231" y="680" fill="#fff" font-size="24">MENSAGEM</text>
    <rect x="444" y="602" width="310" height="104" rx="20" fill="#1b1714" stroke="#564529"/>
    <text x="599" y="646" fill="#d8b45f" font-size="18" letter-spacing="2">02</text><text x="599" y="680" fill="#fff" font-size="24">CONTEÚDO</text>
    <rect x="812" y="602" width="312" height="104" rx="20" fill="#1b1714" stroke="#564529"/>
    <text x="968" y="646" fill="#d8b45f" font-size="18" letter-spacing="2">03</text><text x="968" y="680" fill="#fff" font-size="24">SEGMENTAÇÃO</text>
  </g>
  <text x="76" y="758" fill="#8d857d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">MPMV — MAIS PERSUASÃO, MAIS VENDAS</text>
</svg>
