<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Ryan Deiss: a técnica por trás de US$ 54 milhões em receita</title>
  <desc id="desc">Capa editorial do Projeto Gigantes do Marketing com fotografia oficial de Ryan Deiss.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070707"/><stop offset="0.64" stop-color="#17120f"/><stop offset="1" stop-color="#2a0d11"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2d27e"/><stop offset="0.58" stop-color="#c18a2d"/><stop offset="1" stop-color="#8c5616"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="60%"><stop offset="0" stop-color="#d6b35f" stop-opacity=".28"/><stop offset="1" stop-color="#d6b35f" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080808"/><stop offset=".48" stop-color="#080808" stop-opacity=".9"/><stop offset=".7" stop-color="#080808" stop-opacity=".18"/><stop offset="1" stop-color="#080808" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="990" cy="270" r="380" fill="url(#halo)"/>
  <path d="M760 0H1200V800H690C780 625 830 442 760 0Z" fill="#120d0d" opacity=".72"/>
  <image xlink:href="ryan-deiss-oficial.png" x="665" y="15" width="535" height="740" preserveAspectRatio="xMidYMid meet"/>
  <rect width="920" height="800" fill="url(#fade)"/>
  <path d="M0 690 C240 615 420 760 720 665 C880 615 1010 625 1200 560 L1200 800 L0 800Z" fill="#070707" opacity=".54"/>
  <text x="72" y="82" fill="#d6b35f" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="4.5">PROJETO GIGANTES DO MARKETING</text>
  <rect x="72" y="110" width="172" height="6" rx="3" fill="url(#gold)"/>
  <text x="72" y="218" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="900" letter-spacing="-3">RYAN</text>
  <text x="72" y="292" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="76" font-weight="900" letter-spacing="-3">DEISS</text>
  <text x="72" y="348" fill="#c8c0b7" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="600">A técnica por trás dos números</text>
