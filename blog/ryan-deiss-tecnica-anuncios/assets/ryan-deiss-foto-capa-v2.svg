    <rect x="72" y="398" width="280" height="138" rx="24" fill="#11100f" stroke="#4a3d29"/>
    <text x="102" y="440" fill="#9f978e" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">MÍDIA</text>
    <text x="102" y="505" fill="url(#gold)" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="900">US$ 8,2 MI</text>
    <rect x="374" y="398" width="300" height="138" rx="24" fill="#11100f" stroke="#4a3d29"/>
    <text x="404" y="440" fill="#9f978e" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">RECEITA</text>
