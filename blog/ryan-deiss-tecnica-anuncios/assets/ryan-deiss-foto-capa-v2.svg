  </g>
  <g font-family="Inter,Arial,sans-serif" font-weight="800" font-size="17">
    <rect x="72" y="584" width="184" height="54" rx="27" fill="#1b1714" stroke="#564529"/><text x="164" y="618" fill="#fff" text-anchor="middle">MENSAGEM</text>
