<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Headline: como criar títulos que prendem atenção</title>
  <desc id="desc">Ilustração em fundo azul claro com cartões de headline, cursor e marca MPMV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefaff"/>
      <stop offset="0.55" stop-color="#cceeff"/>
      <stop offset="1" stop-color="#9bd9ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0f5b89" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="210" fill="#ffffff" opacity="0.32"/>
  <circle cx="90" cy="780" r="260" fill="#0a6b9b" opacity="0.08"/>
  <g transform="translate(122 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="956" height="680" rx="48" fill="url(#card)"/>
    <rect x="0" y="0" width="956" height="92" rx="48" fill="#082a43"/>
    <rect x="0" y="46" width="956" height="46" fill="#082a43"/>
    <circle cx="54" cy="46" r="11" fill="#87d3ff"/>
    <circle cx="88" cy="46" r="11" fill="#d9f1ff"/>
    <circle cx="122" cy="46" r="11" fill="#ffffff"/>
    <text x="820" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#9bd9ff">MPMV</text>

    <text x="70" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#0b6b9f">COPYWRITING + CONTEÚDO</text>
    <text x="70" y="245" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="#13263a">HEADLINE</text>
    <text x="70" y="305" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#0877b5">o título precisa dar motivo</text>
    <text x="70" y="346" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#0877b5">para continuar</text>

    <g transform="translate(70 410)">
      <rect width="470" height="76" rx="18" fill="#e8f7ff" stroke="#a7d8f2"/>
      <text x="26" y="32" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183b52">Como criar uma headline que</text>
      <text x="26" y="57" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#0877b5">prende atenção sem clickbait</text>
    </g>
    <g transform="translate(70 510)">
      <rect width="470" height="76" rx="18" fill="#ffffff" stroke="#c9dce7"/>
      <text x="26" y="32" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#183b52">30 exemplos + fórmulas</text>
      <text x="26" y="57" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#0877b5">para posts, anúncios e páginas</text>
    </g>

    <g transform="translate(610 210)">
      <rect width="250" height="324" rx="30" fill="#0b2f49"/>
      <rect x="22" y="26" width="206" height="34" rx="12" fill="#164b6c"/>
      <rect x="22" y="84" width="170" height="19" rx="9" fill="#9bd9ff"/>
      <rect x="22" y="120" width="194" height="14" rx="7" fill="#d7effc" opacity=".92"/>
      <rect x="22" y="146" width="174" height="14" rx="7" fill="#d7effc" opacity=".72"/>
      <rect x="22" y="172" width="188" height="14" rx="7" fill="#d7effc" opacity=".72"/>
      <rect x="22" y="218" width="152" height="54" rx="20" fill="#8fd3ff"/>
      <text x="98" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#082a43">CONTINUE</text>
    </g>
    <path d="M820 545 L865 620 L836 609 L818 650 L790 637 L808 597 L776 599 Z" fill="#082a43" stroke="#ffffff" stroke-width="8"/>
  </g>
</svg>
