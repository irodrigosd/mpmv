<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Psicologia de preços para infoprodutos</title>
  <desc id="desc">Arquitetura visual mostrando promessa, comparação, risco e pagamento conduzindo a leitura do preço.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.62" stop-color="#171411"/>
      <stop offset="1" stop-color="#291015"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d17a"/>
      <stop offset="0.55" stop-color="#c48c2f"/>
      <stop offset="1" stop-color="#8d5918"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f1820"/>
      <stop offset="1" stop-color="#c7333b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d6aa4e" stop-opacity=".26"/>
      <stop offset="1" stop-color="#d6aa4e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="1" fill="#fff" opacity=".035"/>
      <circle cx="33" cy="20" r="1.4" fill="#fff" opacity=".025"/>
      <circle cx="17" cy="39" r="1" fill="#fff" opacity=".03"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" rx="44" fill="url(#bg)"/>
  <rect width="1200" height="1500" rx="44" fill="url(#grain)"/>
  <circle cx="1040" cy="230" r="360" fill="url(#glow)"/>
  <circle cx="100" cy="1310" r="380" fill="#a51f27" opacity=".08"/>

  <g transform="translate(72 70)">
    <rect width="88" height="88" rx="24" fill="url(#gold)"/>
    <text x="44" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="900" fill="#111">MP</text>
    <text x="112" y="37" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#d9b65f">MPMV</text>
    <text x="112" y="68" font-family="Inter,Arial,sans-serif" font-size="18" fill="#aaa39a">Mais Persuasão, Mais Vendas</text>
  </g>

  <g transform="translate(72 230)">
    <rect width="395" height="44" rx="22" fill="#201d19" stroke="#5d4a28"/>
    <circle cx="24" cy="22" r="6" fill="#d4a647"/>
    <text x="44" y="29" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#e8ca82">INFOPRODUTOS + PREÇO</text>
  </g>

  <text x="72" y="370" font-family="Inter,Arial,sans-serif" font-size="84" font-weight="950" letter-spacing="-4" fill="#f8f4ed">O PREÇO</text>
  <text x="72" y="463" font-family="Inter,Arial,sans-serif" font-size="84" font-weight="950" letter-spacing="-4" fill="url(#gold)">NUNCA CHEGA</text>
  <text x="72" y="556" font-family="Inter,Arial,sans-serif" font-size="84" font-weight="950" letter-spacing="-4" fill="#f8f4ed">SOZINHO.</text>
  <text x="75" y="620" font-family="Inter,Arial,sans-serif" font-size="26" fill="#bfb7ad">A oferta prepara a leitura do número.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="700" width="1056" height="585" rx="34" fill="#11100f" stroke="#3b342b" stroke-width="2"/>
    <path d="M310 844H430" stroke="#69552c" stroke-width="4" stroke-linecap="round"/>
    <path d="M422 833L440 844L422 855" fill="none" stroke="#d3a544" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M665 844H785" stroke="#69552c" stroke-width="4" stroke-linecap="round"/>
    <path d="M777 833L795 844L777 855" fill="none" stroke="#d3a544" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(105 757)">
      <rect width="205" height="174" rx="24" fill="#1b1916" stroke="#554527"/>
      <circle cx="42" cy="43" r="20" fill="#2d271c" stroke="#d2a346"/>
      <path d="M32 43l8 8 14-19" fill="none" stroke="#e8c36c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="25" y="104" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850" letter-spacing="2" fill="#d7b55f">PROMESSA</text>
      <text x="25" y="135" font-family="Inter,Arial,sans-serif" font-size="18" fill="#d8d2cb">O que muda?</text>
    </g>
    <g transform="translate(450 757)">
      <rect width="205" height="174" rx="24" fill="#1b1916" stroke="#554527"/>
      <circle cx="42" cy="43" r="20" fill="#2d271c" stroke="#d2a346"/>
      <path d="M30 48h25M34 37h17" stroke="#e8c36c" stroke-width="5" stroke-linecap="round"/>
      <text x="25" y="104" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850" letter-spacing="2" fill="#d7b55f">COMPARAÇÃO</text>
      <text x="25" y="135" font-family="Inter,Arial,sans-serif" font-size="18" fill="#d8d2cb">Qual opção?</text>
    </g>
    <g transform="translate(795 757)">
      <rect width="300" height="174" rx="24" fill="#1b1916" stroke="#554527"/>
      <circle cx="42" cy="43" r="20" fill="#2d271c" stroke="#d2a346"/>
      <path d="M42 28v30M42 65v2" stroke="#e8c36c" stroke-width="5" stroke-linecap="round"/>
      <text x="25" y="104" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="850" letter-spacing="2" fill="#d7b55f">RISCO</text>
      <text x="25" y="135" font-family="Inter,Arial,sans-serif" font-size="18" fill="#d8d2cb">Posso confiar?</text>
    </g>

    <path d="M208 962V1015H997V962" fill="none" stroke="#5b4928" stroke-width="4" stroke-linecap="round"/>
    <path d="M588 1005L603 1022L618 1005" fill="none" stroke="#d3a544" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="185" y="1042" width="830" height="184" rx="28" fill="url(#red)"/>
    <text x="600" y="1100" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="850" letter-spacing="4" fill="#f0d5d7">PREÇO INTERPRETADO</text>
    <text x="600" y="1175" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="950" letter-spacing="-2" fill="#fff">12x R$ 49,70</text>
    <text x="600" y="1208" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#f4d8da">ou R$ 497 à vista</text>
  </g>

  <g transform="translate(72 1345)">
    <rect width="1056" height="84" rx="24" fill="#171512" stroke="#40382e"/>
    <text x="36" y="52" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#efe7dc">Clareza</text>
    <circle cx="174" cy="43" r="4" fill="#c99c3d"/>
    <text x="199" y="52" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#efe7dc">Contexto</text>
    <circle cx="360" cy="43" r="4" fill="#c99c3d"/>
    <text x="385" y="52" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#efe7dc">Transparência</text>
    <text x="1018" y="52" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="18" fill="#a79f95">MPMV</text>
  </g>
</svg>
