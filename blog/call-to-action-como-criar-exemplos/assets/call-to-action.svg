<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Call to action: como criar e 50 exemplos</title>
  <desc id="desc">Composição clara da MPMV com um botão de chamada para ação e a fórmula ação mais benefício.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fafdff"/>
      <stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a2c47"/>
      <stop offset="1" stop-color="#12618d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#154b6d" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1045" cy="115" r="170" fill="#8fd3ff" opacity=".52"/>
  <circle cx="115" cy="800" r="190" fill="#ffffff" opacity=".74"/>

  <!-- Todos os elementos principais ficam dentro da área segura central -->
  <g filter="url(#shadow)">
    <rect x="155" y="165" width="890" height="570" rx="38" fill="#ffffff" stroke="#b9d8e8" stroke-width="3"/>
  </g>

  <g transform="translate(215 225)">
    <rect width="205" height="18" rx="9" fill="#0b3857"/>
    <rect y="46" width="455" height="13" rx="7" fill="#a8bcc9"/>
    <rect y="78" width="390" height="13" rx="7" fill="#c4d4de"/>
    <rect y="110" width="430" height="13" rx="7" fill="#c4d4de"/>

    <text x="0" y="196" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#092740">AÇÃO + BENEFÍCIO</text>
    <text x="0" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#456276">Mostre o próximo passo e o que a pessoa ganha.</text>

    <rect y="286" width="500" height="94" rx="47" fill="url(#btn)"/>
    <text x="250" y="344" font-family="Arial, sans-serif" font-size="29" font-weight="900" fill="#ffffff" text-anchor="middle">QUERO VER OS 50 EXEMPLOS</text>

    <rect y="426" width="315" height="74" rx="37" fill="#dff3ff" stroke="#8fd3ff" stroke-width="3"/>
    <text x="157.5" y="473" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#07598b" text-anchor="middle">BAIXAR O GUIA</text>
  </g>

  <g transform="translate(790 260)">
    <rect width="190" height="190" rx="32" fill="#092740"/>
    <path d="M55 88h80M95 48v80" stroke="#9dd9ff" stroke-width="14" stroke-linecap="round"/>
    <text x="95" y="158" font-family="Arial, sans-serif" font-size="21" font-weight="900" fill="#ffffff" text-anchor="middle">CTA</text>
  </g>

  <g transform="translate(765 505)">
    <rect width="240" height="124" rx="28" fill="#eef9ff" stroke="#92d2f7" stroke-width="3"/>
    <text x="120" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#07598b" text-anchor="middle">PRÓXIMO PASSO</text>
    <path d="M70 79h82m0 0-24-24m24 24-24 24" fill="none" stroke="#092740" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="600" y="805" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#315d77" text-anchor="middle">MPMV • COPYWRITING + CONVERSÃO</text>
</svg>
