<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Order bump no checkout</title>
<desc id="desc">Ilustração de um checkout com uma oferta complementar sendo adicionada ao pedido.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fafdff"/>
    <stop offset="0.55" stop-color="#dff3ff"/>
    <stop offset="1" stop-color="#a9ddff"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#0b3654" flood-opacity=".18"/>
  </filter>
</defs>
<rect width="1200" height="900" rx="44" fill="url(#bg)"/>
<circle cx="108" cy="126" r="78" fill="#8fd3ff" opacity=".42"/>
<circle cx="1080" cy="760" r="150" fill="#ffffff" opacity=".42"/>
<g transform="translate(148 108)">
  <text x="0" y="0" dominant-baseline="hanging" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#07598b">MPMV · CHECKOUT</text>
  <text x="0" y="58" dominant-baseline="hanging" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900" fill="#09243a">O pedido já existe.</text>
  <text x="0" y="142" dominant-baseline="hanging" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="900" fill="#0874ad">Quanto ele pode valer?</text>
</g>
<g filter="url(#shadow)" transform="translate(245 335)">
  <rect width="710" height="430" rx="34" fill="#ffffff"/>
  <rect x="42" y="38" width="626" height="80" rx="18" fill="#f4f9fc" stroke="#cbdde9"/>
  <rect x="64" y="58" width="44" height="44" rx="12" fill="#8fd3ff"/>
  <text x="132" y="67" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#14233a">Produto principal</text>
  <text x="565" y="67" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="900" fill="#14233a">R$ 197</text>
  <rect x="42" y="146" width="626" height="146" rx="22" fill="#e6f5ff" stroke="#79bfe7" stroke-width="2"/>
  <rect x="66" y="174" width="38" height="38" rx="8" fill="#ffffff" stroke="#0874ad" stroke-width="3"/>
  <path d="M76 193l8 8 16-19" fill="none" stroke="#0874ad" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="171" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="900" fill="#07598b">ADICIONE AO PEDIDO</text>
  <text x="126" y="207" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="850" fill="#14233a">Template complementar</text>
  <text x="126" y="247" font-family="Inter,Arial,sans-serif" font-size="18" fill="#4e6477">Pronto para usar junto com o produto principal</text>
  <text x="554" y="218" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900" fill="#0874ad">+ R$ 27</text>
  <line x1="42" y1="326" x2="668" y2="326" stroke="#d9e7ef"/>
  <text x="44" y="370" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#4e6477">TOTAL</text>
  <text x="552" y="370" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="950" fill="#09243a">R$ 224</text>
</g>
</svg>