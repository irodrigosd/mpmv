<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset=".65" stop-color="#171311"/><stop offset="1" stop-color="#261014"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f2d47f"/><stop offset=".58" stop-color="#c58b2f"/><stop offset="1" stop-color="#8d5818"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".42"/></filter>
</defs>
<rect width="1200" height="675" rx="34" fill="url(#bg)"/>
<circle cx="116" cy="105" r="170" fill="#c58b2f" opacity=".09"/><circle cx="1100" cy="590" r="210" fill="#9d1f27" opacity=".12"/>
<g font-family="Inter,Arial,sans-serif">
  <text x="82" y="104" fill="#e5bd5c" font-size="24" font-weight="800" letter-spacing="3">PÁGINA DE VENDAS</text>
  <text x="82" y="180" fill="#fff" font-size="60" font-weight="900">A objeção aparece.</text>
  <text x="82" y="248" fill="#fff" font-size="60" font-weight="900">A página precisa</text>
  <text x="82" y="316" fill="url(#gold)" font-size="60" font-weight="900">ter a resposta.</text>
  <text x="82" y="376" fill="#c9c2bb" font-size="25">Dúvida → contexto → prova → decisão</text>

  <g filter="url(#shadow)">
    <rect x="740" y="92" width="350" height="95" rx="22" fill="#f7f2e8"/>
    <text x="773" y="132" fill="#171512" font-size="19" font-weight="800">“Isso serve para mim?”</text>
    <text x="773" y="160" fill="#6e6258" font-size="15">Critério + exemplo + prova</text>
    <rect x="698" y="211" width="350" height="95" rx="22" fill="#f7f2e8"/>
    <text x="731" y="251" fill="#171512" font-size="19" font-weight="800">“Vai caber na rotina?”</text>
    <text x="731" y="279" fill="#6e6258" font-size="15">Entrega + tempo + acesso</text>
    <rect x="776" y="330" width="350" height="95" rx="22" fill="#f7f2e8"/>
    <text x="809" y="370" fill="#171512" font-size="19" font-weight="800">“Vale o investimento?”</text>
    <text x="809" y="398" fill="#6e6258" font-size="15">Valor + comparação + prova</text>
  </g>
  <path d="M676 144 C640 144 636 210 676 210" fill="none" stroke="#d4a23f" stroke-width="6" stroke-linecap="round"/><path d="M650 195 l26 15 -26 15" fill="none" stroke="#d4a23f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="82" y="487" width="520" height="94" rx="22" fill="#111" stroke="#3b332b"/>
  <text x="111" y="525" fill="#d8a94d" font-size="17" font-weight="900" letter-spacing="2">MAPA DA RESPOSTA</text>
  <text x="111" y="557" fill="#fff" font-size="21" font-weight="800">Objeção + explicação + evidência + ação</text>
  <text x="82" y="632" fill="#9e978f" font-size="18">MPMV — Mais Persuasão, Mais Vendas</text>
</g>
</svg>