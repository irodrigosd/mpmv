<text x="90" y="105" fill="#e0bc65" font-family="Arial" font-size="28" font-weight="700">SEGUNDA MENSAGEM</text>
<g transform="translate(90 165)"><rect width="1020" height="135" rx="26" fill="#171717" stroke="#3a352d"/><circle cx="72" cy="67" r="38" fill="#2a2927"/><text x="59" y="80" fill="#ddd" font-family="Arial" font-size="34" font-weight="700">1</text><text x="140" y="57" fill="#fff" font-family="Arial" font-size="32" font-weight="700">Já viu</text><text x="140" y="98" fill="#aaa29a" font-family="Arial" font-size="24">Anúncio, artigo, página ou oferta</text><text x="860" y="80" fill="#aaa29a" font-family="Arial" font-size="22" font-weight="700">CONTATO</text></g>
