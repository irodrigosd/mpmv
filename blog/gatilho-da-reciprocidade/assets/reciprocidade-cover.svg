<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Gatilho da reciprocidade</title>
<desc id="d">Ilustração de troca de valor por meio de um guia e uma relação de confiança.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
