    <stop offset="1" stop-color="#a9ddff"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b304b"/>
    <stop offset="1" stop-color="#082238"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0a3c5d" flood-opacity=".18"/>
  </filter>
</defs>
