<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="t d">
<title id="t">Fluxo da reciprocidade</title>
<desc id="d">Diagrama com as etapas valor, percepção, confiança e próximo passo.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8fcff"/>
    <stop offset="1" stop-color="#dff3ff"/>
  </linearGradient>
</defs>
<rect width="1400" height="800" rx="42" fill="url(#bg)"/>
<text x="90" y="115" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0874ad">RECIPROCIDADE EM VENDAS</text>
<text x="90" y="165" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#09243a">A sequência que cria contexto para a oferta</text>

<g transform="translate(90 270)">
  <rect width="265" height="260" rx="28" fill="#ffffff" stroke="#b7d8ea" stroke-width="2"/>
  <circle cx="54" cy="58" r="30" fill="#8fd3ff"/>
  <text x="54" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#09243a">1</text>
  <text x="30" y="130" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#09243a">VALOR</text>
  <text x="30" y="174" font-family="Arial, sans-serif" font-size="19" fill="#4e6477">Guia, conteúdo,</text>
  <text x="30" y="204" font-family="Arial, sans-serif" font-size="19" fill="#4e6477">aula, análise.</text>
</g>
<path d="M375 400h80" stroke="#0874ad" stroke-width="6" stroke-linecap="round"/>
<path d="M438 384l22 16-22 16" fill="none" stroke="#0874ad" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

<g transform="translate(475 270)">
  <rect width="265" height="260" rx="28" fill="#ffffff" stroke="#b7d8ea" stroke-width="2"/>
  <circle cx="54" cy="58" r="30" fill="#8fd3ff"/>
  <text x="54" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#09243a">2</text>
  <text x="30" y="130" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#09243a">PERCEPÇÃO</text>
  <text x="30" y="174" font-family="Arial, sans-serif" font-size="19" fill="#4e6477">“Isso me ajudou.”</text>
  <text x="30" y="204" font-family="Arial, sans-serif" font-size="19" fill="#4e6477">Existe experiência.</text>
</g>
<path d="M760 400h80" stroke="#0874ad" stroke-width="6" stroke-linecap="round"/>
<path d="M823 384l22 16-22 16" fill="none" stroke="#0874ad" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

<g transform="translate(860 270)">
  <rect width="265" height="260" rx="28" fill="#ffffff" stroke="#b7d8ea" stroke-width="2"/>
  <circle cx="54" cy="58" r="30" fill="#8fd3ff"/>
  <text x="54" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#09243a">3</text>
  <text x="30" y="130" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#09243a">CONFIANÇA</text>
  <text x="30" y="174" font-family="Arial, sans-serif" font-size="19" fill="#4e6477">Mais abertura</text>
  <text x="30" y="204" font-family="Arial, sans-serif" font-size="19" fill="#4e6477">para continuar.</text>
</g>

<path d="M1145 400h80" stroke="#0874ad" stroke-width="6" stroke-linecap="round"/>
<path d="M1208 384l22 16-22 16" fill="none" stroke="#0874ad" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

<g transform="translate(1245 270)">
  <rect width="115" height="260" rx="28" fill="#09243a"/>
  <text x="57" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="#9dd9ff">→</text>
  <text x="57" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#fff">PRÓXIMO</text>
  <text x="57" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#fff">PASSO</text>
</g>

<rect x="90" y="615" width="1270" height="86" rx="22" fill="#09243a"/>
<text x="125" y="668" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">A oferta entra como continuação da experiência — e não como pedido vindo do nada.</text>
</svg>