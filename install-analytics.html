<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Instalar Google Analytics | MPMV</title>
<style>
:root{--bg:#101010;--panel:#181818;--line:#333;--text:#f5f5f5;--muted:#aaa;--gold:#c99a2e;--green:#69d68b;--red:#ff8181}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.box{width:min(620px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}.brand{font-weight:900;letter-spacing:.08em;color:var(--gold)}h1{font-size:clamp(1.8rem,5vw,2.7rem);margin:.6rem 0}.muted{color:var(--muted);line-height:1.55}.field{display:grid;gap:8px;margin:22px 0}.field label{font-weight:800}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #444;background:#0e0e0e;color:#fff;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:14px;background:var(--gold);color:#17120a;font-weight:900;font-size:1rem;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.msg{margin-top:18px;padding:13px;border-radius:10px;display:none;line-height:1.5}.msg.ok{display:block;background:rgba(105,214,139,.1);border:1px solid rgba(105,214,139,.3);color:#a9efbd}.msg.error{display:block;background:rgba(255,129,129,.1);border:1px solid rgba(255,129,129,.3);color:#ffc0c0}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff}</style>
</head>
<body>
<main class="box">
  <div class="brand">MPMV</div>
  <h1>Instalar Google Analytics</h1>
  <p class="muted">Este instalador adiciona o Google Analytics <span class="code">G-CJHQRJY79Z</span> às páginas públicas, respeita a escolha de cookies e prepara o publicador do blog para incluir a medição nos próximos artigos.</p>
  <div class="field"><label for="password">Senha administrativa</label><input id="password" type="password" autocomplete="current-password" placeholder="A mesma senha do /admin/blog"></div>
  <button id="install" class="btn" type="button">INSTALAR ANALYTICS</button>
  <div id="msg" class="msg"></div>
</main>
<script>
const $=id=>document.getElementById(id);
$('install').onclick=async()=>{
  const token=$('password').value.trim();
  if(!token){$('msg').className='msg error';$('msg').textContent='Digite a senha administrativa.';return}
  $('install').disabled=true;$('install').textContent='INSTALANDO...';$('msg').className='msg';$('msg').textContent='';
  try{
    const r=await fetch('/api/install-analytics',{method:'POST',headers:{'content-type':'application/json','x-admin-token':token},body:'{}'});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.message||d.error||('Erro '+r.status));
    $('msg').className='msg ok';
    $('msg').innerHTML='<strong>Instalação concluída.</strong><br>Commit criado no GitHub. O Vercel vai publicar a nova versão automaticamente. Esta página e a API de instalação também serão removidas no novo deploy.';
    $('install').textContent='CONCLUÍDO';
  }catch(e){
    $('msg').className='msg error';$('msg').textContent=e.message;
    $('install').disabled=false;$('install').textContent='TENTAR NOVAMENTE';
  }
};
</script>
</body>
</html>
