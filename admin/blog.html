<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin Blog | MPMV</title>
<style>
:root{--bg:#0b0b0b;--card:#151515;--line:#2b2b2b;--txt:#f5f1e8;--muted:#a59e94;--gold:#d1a447;--red:#c63b42;--green:#3d9b70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:40px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{font-weight:900;font-size:24px}.brand span{color:var(--gold)}.back{color:var(--muted);text-decoration:none}.note{border:1px solid var(--line);background:#101010;padding:16px 18px;border-radius:14px;color:var(--muted);margin-bottom:20px}.grid{display:grid;gap:14px}.post{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:20px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.post h2{font-size:20px;margin:0 0 6px}.url{font-size:13px;color:var(--gold);word-break:break-all}.seo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.field{background:#0f0f0f;border:1px solid #242424;border-radius:12px;padding:12px}.field b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#817a72;margin-bottom:5px}.field span{font-size:14px;line-height:1.4}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;font-size:13px}.open{background:#272727;color:#fff}.delete{background:var(--red);color:#fff}.delete:disabled{opacity:.45;cursor:not-allowed}.status{font-size:12px;color:#b9d9c8;background:rgba(61,155,112,.15);padding:5px 8px;border-radius:999px;display:inline-block;margin-top:8px}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}@media(max-width:720px){.row{display:block}.actions{margin-top:14px}.seo{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap"><div class="top"><div class="brand"><span>MPMV</span> / Admin Blog</div><a class="back" href="/blog/">Ver blog</a></div>
<div class="note">Aqui você vê título, título SEO, meta descrição, frase-chave e slug. O botão <strong>Excluir artigo</strong> remove o arquivo do repositório e tira o post do índice do blog. Na primeira exclusão, informe o token de administração configurado na Vercel.</div>
<div id="list" class="grid"><div class="empty">Carregando artigos...</div></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){const box=document.getElementById('list');try{const r=await fetch('/data/blog-posts.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Não foi possível carregar os artigos.');const posts=await r.json();if(!posts.length){box.innerHTML='<div class="empty">Nenhum artigo cadastrado.</div>';return;}box.innerHTML=posts.map(p=>`<article class="post" data-slug="${esc(p.slug)}"><div class="row"><div><h2>${esc(p.title)}</h2><div class="url">${esc(p.url)}</div><span class="status">${esc(p.status)}</span></div><div class="actions"><a class="btn open" href="${esc(p.url)}" target="_blank">Abrir</a><button class="btn delete" data-delete="${esc(p.slug)}" ${p.deletable?'':'disabled'}>Excluir artigo</button></div></div><div class="seo"><div class="field"><b>Título SEO</b><span>${esc(p.seoTitle)}</span></div><div class="field"><b>Frase-chave de foco</b><span>${esc(p.focusKeyphrase)}</span></div><div class="field"><b>Meta descrição</b><span>${esc(p.metaDescription)}</span></div><div class="field"><b>Slug</b><span>${esc(p.slug)}</span></div></div></article>`).join('');document.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',()=>removePost(btn.dataset.delete,btn)));}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
async function removePost(slug,btn){const post=btn.closest('.post');const title=post.querySelector('h2').textContent;if(!confirm(`Excluir definitivamente o artigo “${title}”?\n\nA exclusão remove o arquivo do repositório e o post do índice.`))return;let token=sessionStorage.getItem('mpmv_admin_token');if(!token){token=prompt('Token de administração:');if(!token)return;sessionStorage.setItem('mpmv_admin_token',token);}btn.disabled=true;btn.textContent='Excluindo...';try{const r=await fetch('/api/admin-blog-delete',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify({slug})});const data=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('mpmv_admin_token');throw new Error('Token inválido. Tente novamente.');}if(!r.ok)throw new Error(data.error||'Falha ao apagar o artigo.');post.remove();alert('Artigo excluído. A Vercel fará o novo deploy a partir do GitHub.');}catch(e){btn.disabled=false;btn.textContent='Excluir artigo';alert(e.message);}}
load();
</script></body></html>
