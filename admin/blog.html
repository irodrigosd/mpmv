<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Blog | MPMV</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="core" title="Admin Blog MPMV"></iframe><script>
const f=document.getElementById('core');
let sortMode='recent';
let postMeta={};
let realLoadScores=null;
let relevanceLoaded=false;
function numScore(article,sel){const t=article.querySelector(sel+' strong');const m=(t&&t.textContent||'').match(/(\d+)/);return m?Number(m[1]):0}
function relevanceScore(article){return numScore(article,'[data-seo-score]')*.65+numScore(article,'[data-read-score]')*.35}
function sortPosts(){try{const d=f.contentDocument,box=d&&d.getElementById('list');if(!box)return;const posts=[...box.querySelectorAll('.post')];posts.sort((a,b)=>{const ma=postMeta[a.dataset.slug]||{},mb=postMeta[b.dataset.slug]||{};if(sortMode==='relevant'&&relevanceLoaded){const r=relevanceScore(b)-relevanceScore(a);if(r)return r}const da=String(ma.publishedAt||''),db=String(mb.publishedAt||'');if(db!==da)return db.localeCompare(da);const ba=Number(ma.batchOrder||0),bb=Number(mb.batchOrder||0);if(ba!==bb)return ba-bb;return (a.querySelector('h2')?.textContent||'').localeCompare(b.querySelector('h2')?.textContent||'','pt-BR')});const frag=d.createDocumentFragment();posts.forEach(p=>frag.appendChild(p));box.appendChild(frag)}catch(e){console.error(e)}}
async function loadMeta(){try{const [a,b]=await Promise.all([fetch('/data/blog-posts.json').then(r=>r.ok?r.json():[]),fetch('/data/blog-posts-extra.json').then(r=>r.ok?r.json():[])]);postMeta={};[...a,...b].forEach(p=>{if(p&&p.slug)postMeta[p.slug]=p});sortPosts()}catch(e){console.error(e)}}
function setDeferredState(article){article.querySelectorAll('[data-seo-score],[data-read-score]').forEach(box=>{box.className='score-card score-loading';box.innerHTML='<span class="score-dot"></span><div><strong>—</strong><small>Análise sob demanda</small></div>'})}
async function auditAll(bar){if(relevanceLoaded||!realLoadScores)return;const d=f.contentDocument,articles=[...d.querySelectorAll('#list .post')];const btn=bar.querySelector('[data-sort="relevant"]');btn.disabled=true;const label=bar.querySelector('[data-progress]');let i=0;const workers=Array.from({length:6},async()=>{while(i<articles.length){const article=articles[i++],p=postMeta[article.dataset.slug];if(!p)continue;label.textContent='Analisando '+i+'/'+articles.length+'...';await realLoadScores(p,article)}});await Promise.all(workers);relevanceLoaded=true;label.textContent='Pronto';btn.disabled=false;sortPosts()}
function mountSorter(){const d=f.contentDocument;if(!d||d.getElementById('mpmv-sortbar'))return;const list=d.getElementById('list');if(!list)return;const bar=d.createElement('div');bar.id='mpmv-sortbar';bar.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:14px 16px;border:1px solid #2b2b2b;background:#111;border-radius:14px';bar.innerHTML='<div style="font-size:13px;color:#a59e94"><strong style="color:#f5f1e8">Ordenar artigos</strong><div data-progress style="font-size:11px;margin-top:3px">As notas só carregam quando você escolher Mais relevantes.</div></div><div style="display:flex;gap:8px"><button type="button" data-sort="recent" class="btn" style="background:#d1a447;color:#15110a">Mais recentes</button><button type="button" data-sort="relevant" class="btn" style="background:#272727;color:#fff">Mais relevantes</button></div>';list.parentNode.insertBefore(bar,list);bar.querySelector('[data-sort="recent"]').onclick=()=>{sortMode='recent';bar.querySelectorAll('[data-sort]').forEach(x=>{const a=x.dataset.sort==='recent';x.style.background=a?'#d1a447':'#272727';x.style.color=a?'#15110a':'#fff'});sortPosts()};bar.querySelector('[data-sort="relevant"]').onclick=async()=>{sortMode='relevant';bar.querySelectorAll('[data-sort]').forEach(x=>{const a=x.dataset.sort==='relevant';x.style.background=a?'#d1a447':'#272727';x.style.color=a?'#15110a':'#fff'});if(!relevanceLoaded)await auditAll(bar);else sortPosts()};loadMeta()}
f.addEventListener('load',()=>{try{const d=f.contentDocument,w=f.contentWindow;if(!d||!w)return;realLoadScores=w.loadScores;w.loadScores=(p,article)=>setDeferredState(article);d.querySelectorAll('#list .post').forEach(setDeferredState);if(!d.getElementById('mpmv-extra-admin')){const s=d.createElement('script');s.id='mpmv-extra-admin';s.src='/admin/vercel-cleanup-widget.js?v=20260907-3';d.body.appendChild(s)}let tries=0;const timer=setInterval(()=>{tries++;mountSorter();sortPosts();if(d.getElementById('mpmv-sortbar')||tries>20)clearInterval(timer)},200)}catch(e){console.error(e)}});
fetch('/admin/blog-core.html?v=20260907-1').then(r=>r.text()).then(html=>{html=html.replace("[...box.querySelectorAll('.post')].forEach((el,i)=>loadScores(posts[i],el));","window.__mpmvPosts=posts;");f.srcdoc=html}).catch(()=>{f.src='/admin/blog-core.html?v=20260907-1'});
</script></body></html>
