<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Blog | MPMV</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0b0b}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="core" src="/admin/blog-core.html?v=20260907-1" title="Admin Blog MPMV"></iframe><script>
const f=document.getElementById('core');
let sortMode='recent';
let postMeta={};
function numScore(article,sel){const t=article.querySelector(sel+' strong');const m=(t&&t.textContent||'').match(/(\d+)/);return m?Number(m[1]):0}
function relevanceScore(article){const seo=numScore(article,'[data-seo-score]');const read=numScore(article,'[data-read-score]');return seo*.65+read*.35}
function sortPosts(){try{const d=f.contentDocument;if(!d)return;const box=d.getElementById('list');if(!box)return;const posts=[...box.querySelectorAll('.post')];posts.sort((a,b)=>{const sa=a.dataset.slug||'',sb=b.dataset.slug||'';const ma=postMeta[sa]||{},mb=postMeta[sb]||{};if(sortMode==='relevant'){const r=relevanceScore(b)-relevanceScore(a);if(r)return r}const da=String(ma.publishedAt||''),db=String(mb.publishedAt||'');if(db!==da)return db.localeCompare(da);const ba=Number(ma.batchOrder||0),bb=Number(mb.batchOrder||0);if(ba!==bb)return ba-bb;return (a.querySelector('h2')?.textContent||'').localeCompare(b.querySelector('h2')?.textContent||'','pt-BR')});posts.forEach(p=>box.appendChild(p))}catch(e){console.error(e)}}
async function loadMeta(){try{const [a,b]=await Promise.all([fetch('/data/blog-posts.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():[]),fetch('/data/blog-posts-extra.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():[])]);postMeta={};[...a,...b].forEach(p=>{if(p&&p.slug)postMeta[p.slug]=p});sortPosts()}catch(e){console.error(e)}}
function mountSorter(){const d=f.contentDocument;if(!d||d.getElementById('mpmv-sortbar'))return;const list=d.getElementById('list');if(!list)return;const bar=d.createElement('div');bar.id='mpmv-sortbar';bar.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:14px 16px;border:1px solid #2b2b2b;background:#111;border-radius:14px';bar.innerHTML='<div style="font-size:13px;color:#a59e94"><strong style="color:#f5f1e8">Ordenar artigos</strong><div style="font-size:11px;margin-top:3px">Mais relevantes usa 65% SEO + 35% legibilidade.</div></div><div style="display:flex;gap:8px"><button type="button" data-sort="recent" class="btn" style="background:#d1a447;color:#15110a">Mais recentes</button><button type="button" data-sort="relevant" class="btn" style="background:#272727;color:#fff">Mais relevantes</button></div>';list.parentNode.insertBefore(bar,list);bar.querySelectorAll('[data-sort]').forEach(btn=>btn.addEventListener('click',()=>{sortMode=btn.dataset.sort;bar.querySelectorAll('[data-sort]').forEach(x=>{const active=x.dataset.sort===sortMode;x.style.background=active?'#d1a447':'#272727';x.style.color=active?'#15110a':'#fff'});sortPosts()}));const obs=new MutationObserver(()=>{if(sortMode==='relevant')sortPosts()});obs.observe(list,{subtree:true,childList:true,characterData:true});loadMeta()}
f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d)return;if(!d.getElementById('mpmv-extra-admin')){const s=d.createElement('script');s.id='mpmv-extra-admin';s.src='/admin/vercel-cleanup-widget.js?v=20260907-3';d.body.appendChild(s)}let tries=0;const timer=setInterval(()=>{tries++;mountSorter();sortPosts();if(d.getElementById('mpmv-sortbar')||tries>30)clearInterval(timer)},250)}catch(e){console.error(e)}});
</script></body></html>
