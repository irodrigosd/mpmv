<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07101a"><title>Brevo | MPMV OS</title><style>
:root{--bg:#07101a;--panel:#0d1824;--line:#203246;--txt:#edf5fb;--muted:#8fa4b8;--blue:#78c8f4;--green:#46c48a;--gold:#e7bf69;--red:#e46e77}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07101a,#0b1826 55%,#07101a);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}.wrap{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 0 calc(90px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}.top h1{margin:0;font-size:30px}.top p{color:var(--muted);margin:5px 0 0;font-size:13px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:10px;min-height:40px;padding:0 13px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.grid{display:grid;grid-template-columns:380px 1fr;gap:14px}.card{border:1px solid var(--line);background:rgba(13,24,36,.92);border-radius:16px;padding:16px}.search{width:100%;height:44px;border:1px solid var(--line);background:#09141f;color:var(--txt);border-radius:11px;padding:0 12px;margin-bottom:12px}.list{max-height:70vh;overflow:auto}.row{padding:12px;border-bottom:1px solid rgba(32,50,70,.65);cursor:pointer;border-radius:10px}.row:hover,.row.active{background:#102131}.row b{display:block;font-size:14px}.row small{color:var(--muted)}.empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}.head h2{margin:0;font-size:24px}.email{color:var(--muted);font-size:13px;margin-top:4px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:15px 0}.metric{border:1px solid var(--line);background:#09141f;border-radius:12px;padding:12px}.metric strong{display:block;font-size:20px}.metric span{font-size:10px;color:var(--muted)}.ok{color:var(--green)}.no{color:var(--muted)}.warn{color:var(--gold)}.bad{color:var(--red)}.section h3{font-size:14px;margin:18px 0 9px}.notice{border:1px dashed var(--line);padding:11px;border-radius:10px;color:var(--muted);font-size:12px;line-height:1.45}.messages{display:grid;gap:9px}.message{border:1px solid var(--line);border-radius:12px;background:#09141f;padding:12px}.message-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.message h4{margin:0;font-size:13px;line-height:1.35}.message time{font-size:10px;color:var(--muted);white-space:nowrap}.message-meta{font-size:10px;color:var(--muted);margin-top:4px}.states{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.state{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;color:var(--muted)}.state.done{border-color:rgba(70,196,138,.5);color:var(--green);background:rgba(70,196,138,.08)}.state.click{border-color:rgba(120,200,244,.5);color:var(--blue);background:rgba(120,200,244,.08)}.links{margin-top:8px;font-size:10px;color:var(--muted);word-break:break-all}.timeline{display:grid;gap:8px}.event{display:grid;grid-template-columns:120px 90px 1fr;gap:10px;padding:9px;border:1px solid var(--line);border-radius:11px;background:#09141f;font-size:12px}.event time,.event .src{color:var(--muted)}.event b{text-transform:capitalize}.mobilebar{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.list{max-height:40vh}.metrics{grid-template-columns:repeat(2,1fr)}.event{grid-template-columns:88px 72px 1fr}.top{display:block}.top .btn{margin-top:10px}.message-top{display:block}.message time{display:block;margin-top:4px}.mobilebar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#0a1520;border:1px solid var(--line);border-radius:15px;padding:6px;z-index:20}.mobilebar a{text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:800;padding:8px 2px}.mobilebar a b{display:block;color:var(--txt);font-size:16px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Brevo</h1><p>Status por e-mail: enviado, entregue, aberto e clicado.</p></div><a class="btn" href="/admin/">← Central MPMV</a></header><div class="grid"><section class="card"><input id="search" class="search" placeholder="Buscar lead por nome ou e-mail"><div id="list" class="list empty">Carregando contatos...</div></section><section id="detail" class="card empty">Selecione um lead.</section></div></main><nav class="mobilebar"><a href="/admin/"><b>⌂</b>Início</a><a href="/admin/leads360/"><b>◎</b>Lead 360</a><a href="/admin/brevo/"><b>✉</b>Brevo</a><a href="/admin/relatorios/"><b>▤</b>Relat.</a></nav><script>
const $=s=>document.querySelector(s);let contacts=[],selected='';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function token(){let t=sessionStorage.getItem('mpmv_admin_token')||'';if(!t){t=prompt('Digite o token do admin MPMV:','')||'';if(t)sessionStorage.setItem('mpmv_admin_token',t);}return t;}function fmt(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?'—':d.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}function eventName(t){const m={opened:'Abriu',unique_opened:'Abriu',first_opening:'Primeira abertura',proxy_open:'Abertura proxy',unique_proxy_open:'Abertura proxy',click:'Clicou',clicked:'Clicou',delivered:'Entregue',sent:'Enviado',hardbounce:'Hard bounce',softbounce:'Soft bounce',blocked:'Bloqueado',spam:'Spam',unsubscribed:'Descadastrou'};return m[String(t||'').toLowerCase()]||String(t||'evento').replace(/_/g,' ');}function renderList(){const q=$('#search').value.toLowerCase().trim(),items=contacts.filter(c=>!q||[c.name,c.email].join(' ').toLowerCase().includes(q));$('#list').className='list';$('#list').innerHTML=items.length?items.map(c=>`<div class="row ${String(c.email).toLowerCase()===selected?'active':''}" data-email="${esc(c.email)}"><b>${esc(c.name||'Sem nome')}</b><small>${esc(c.email)}</small></div>`).join(''):'<div class="empty">Nenhum lead encontrado.</div>';document.querySelectorAll('.row').forEach(r=>r.onclick=()=>openLead(r.dataset.email));}
async function load(){const t=token();if(!t)return;const r=await fetch('/api/leads?limit=500',{headers:{'x-admin-token':t},cache:'no-store'});if(r.status===401){sessionStorage.removeItem('mpmv_admin_token');location.reload();return;}const d=await r.json();contacts=Array.isArray(d.contacts)?d.contacts:[];renderList();const target=new URLSearchParams(location.search).get('email');if(target)openLead(target);}
function renderMessage(m){const date=m.sentAt||m.deliveredAt||m.openedAt||m.clickedAt||m.date;const subject=m.subject||'E-mail sem assunto';const states=[['Enviado',m.sent,'done'],['Entregue',m.delivered,'done'],['Abriu',m.opened,'done'],['Clicou',m.clicked,'click']];return `<div class="message"><div class="message-top"><div><h4>${esc(subject)}</h4><div class="message-meta">${m.kind==='campaign'?'Campanha':'Transacional'}${m.campaignId?' · ID '+esc(m.campaignId):''}</div></div><time>${esc(fmt(date))}</time></div><div class="states">${states.map(([label,done,cls])=>`<span class="state ${done?cls:''}">${done?'✓ ':''}${label}</span>`).join('')}${m.opens?`<span class="state done">${Number(m.opens)} abertura(s)</span>`:''}${m.clicks?`<span class="state click">${Number(m.clicks)} clique(s)</span>`:''}</div>${Array.isArray(m.urls)&&m.urls.length?`<div class="links">Links clicados: ${m.urls.map(u=>esc(u)).join(' · ')}</div>`:''}</div>`;}
async function openLead(email){selected=String(email||'').toLowerCase();renderList();history.replaceState(null,'','?email='+encodeURIComponent(selected));const c=contacts.find(x=>String(x.email).toLowerCase()===selected);$('#detail').className='card';$('#detail').innerHTML='<div class="empty">Consultando Brevo...</div>';const t=token();try{const r=await fetch('/api/brevo-activity?email='+encodeURIComponent(selected),{headers:{'x-admin-token':t},cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao consultar Brevo');const s=d.summary||{},events=Array.isArray(d.activity)?d.activity:[],messages=Array.isArray(d.messages)?d.messages:[];$('#detail').innerHTML=`<div class="head"><h2>${esc(c&&c.name||'Sem nome')}</h2><div class="email">${esc(selected)}</div></div><div class="metrics"><div class="metric"><strong class="${s.sent?'ok':'no'}">${s.sent?'SIM':'NÃO'}</strong><span>Recebeu e-mail</span></div><div class="metric"><strong class="${s.opened?'ok':'no'}">${s.opened?'SIM':'NÃO'}</strong><span>Abriu algum e-mail</span></div><div class="metric"><strong class="${s.clicked?'ok':'no'}">${s.clicked?'SIM':'NÃO'}</strong><span>Clicou em algum</span></div><div class="metric"><strong>${Number(s.opens||0)}</strong><span>Aberturas/eventos</span></div><div class="metric"><strong>${Number(s.clicks||0)}</strong><span>Cliques/eventos</span></div></div><div class="notice">Agora o painel separa a atividade por mensagem. Assim você consegue saber qual e-mail foi enviado, qual abriu e qual recebeu clique.</div><div class="section"><h3>E-mails enviados</h3>${messages.length?`<div class="messages">${messages.map(renderMessage).join('')}</div>`:'<div class="empty">Nenhuma mensagem identificada para esse contato.</div>'}</div><div class="section"><h3>Linha do tempo técnica</h3>${events.length?`<div class="timeline">${events.map(e=>`<div class="event"><time>${esc(fmt(e.date))}</time><div class="src">${esc(e.source==='campaign'?'Campanha':'Transacional')}</div><div><b>${esc(eventName(e.type))}</b>${e.subject?`<br><small>${esc(e.subject)}</small>`:''}${e.url?`<br><small>${esc(e.url)}</small>`:''}</div></div>`).join('')}</div>`:'<div class="empty">Nenhuma atividade encontrada para esse contato.</div>'}</div>`;}catch(e){$('#detail').innerHTML='<div class="notice"><b>Erro:</b> '+esc(e.message)+'</div>';}}
$('#search').addEventListener('input',renderList);load();
</script></body></html>
