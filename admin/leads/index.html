<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07101a"><title>Leads | MPMV OS</title><style>
:root{--bg:#07101a;--panel:#0d1824;--line:#203246;--txt:#edf5fb;--muted:#8fa4b8;--blue:#78c8f4;--green:#46c48a;--red:#e46e77}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07101a,#0b1826 55%,#07101a);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}.wrap{width:min(1200px,calc(100% - 24px));margin:auto;padding:22px 0 80px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.top h1{margin:0;font-size:30px}.top p{margin:6px 0 0;color:var(--muted);font-size:13px}.btn{border:1px solid var(--line);background:#111f2e;color:var(--txt);border-radius:10px;min-height:40px;padding:0 13px;font-weight:850;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--blue);color:#061d2b;border-color:transparent}.btn.red{border-color:#6d3238;color:#ff9da5}.btn:disabled{opacity:.45;cursor:not-allowed}.card{border:1px solid var(--line);background:rgba(13,24,36,.95);border-radius:16px;padding:16px;margin-top:14px}.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px}.field label{font-size:9px;color:var(--muted);font-weight:900;text-transform:uppercase}.input{border:1px solid var(--line);background:#08131e;color:var(--txt);border-radius:9px;padding:10px 11px;min-height:40px}.msg{margin-top:12px;border:1px dashed var(--line);border-radius:10px;padding:10px;color:var(--muted);font-size:11px}.msg.ok{color:var(--green)}.msg.bad{color:var(--red)}.tablewrap{overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:850px;background:#08131e}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-size:9px;text-transform:uppercase;background:#0b1723;position:sticky;top:0}tr:last-child td{border-bottom:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{min-height:32px;padding:0 9px;font-size:10px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:9px;color:var(--muted)}.danger{margin-top:12px;padding:11px;border:1px solid #5d3035;border-radius:10px;color:#ffc3c8;font-size:11px;background:#160d11}@media(max-width:720px){.top h1{font-size:25px}.toolbar{align-items:stretch}.field{width:100%}.toolbar .btn{flex:1}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Leads</h1><p>Gerencie a lista da Brevo sem sair do MPMV OS.</p></div><div class="actions"><a class="btn" href="/admin/automacao/">← Automações</a><a class="btn" href="/admin/">Central MPMV</a></div></header>
<section class="card"><div class="toolbar"><div class="field"><label>ID da lista Brevo</label><input id="listId" class="input" type="number" min="1" value="5"></div><button id="loadBtn" class="btn primary">Carregar lista</button><button id="selectAllBtn" class="btn">Selecionar todos</button><button id="deleteSelectedBtn" class="btn red" disabled>Excluir selecionados</button></div><div class="danger"><b>Excluir contato</b> remove o lead da Brevo inteira. <b>Remover da lista</b> só tira o lead da lista escolhida e preserva o contato na Brevo.</div><div id="msg" class="msg">Carregue a lista para começar.</div><div class="tablewrap"><table><thead><tr><th style="width:42px"></th><th>Nome</th><th>E-mail</th><th>Criado em</th><th>Status</th><th>Ações</th></tr></thead><tbody id="tbody"><tr><td colspan="6">Nenhum dado carregado.</td></tr></tbody></table></div></section></main>
<script>
const API='/api/guia?action=contacts-admin', $=s=>document.querySelector(s);let contacts=[];
function token(){let t=sessionStorage.getItem('mpmv_admin_token')||'';if(!t){t=prompt('Digite o token do admin MPMV:','')||'';if(t)sessionStorage.setItem('mpmv_admin_token',t)}return t}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(t,type=''){const e=$('#msg');e.textContent=t;e.className='msg'+(type?' '+type:'')}
function listId(){return Math.max(1,Number($('#listId').value)||5)}
async function call(body){const url=body?API:`${API}&listId=${encodeURIComponent(listId())}`;const r=await fetch(url,{method:body?'POST':'GET',headers:{'x-admin-token':token(),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});let d={};try{d=await r.json()}catch(_){throw new Error('Resposta inválida do servidor')}if(r.status===401){sessionStorage.removeItem('mpmv_admin_token');throw new Error('Token inválido')}if(!r.ok&&r.status!==207)throw new Error(d.error||'Falha ao processar');return d}
function date(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('pt-BR')}
function selected(){return [...document.querySelectorAll('.sel:checked')].map(x=>x.value)}
function updateBulk(){const n=selected().length;$('#deleteSelectedBtn').disabled=!n;$('#deleteSelectedBtn').textContent=n?`Excluir selecionados (${n})`:'Excluir selecionados'}
function render(){const body=$('#tbody');if(!contacts.length){body.innerHTML='<tr><td colspan="6">Essa lista está vazia.</td></tr>';updateBulk();return}body.innerHTML=contacts.map(c=>`<tr><td><input class="sel" type="checkbox" value="${esc(c.email)}" onchange="updateBulk()"></td><td>${esc(c.name||'—')}</td><td>${esc(c.email)}</td><td>${date(c.createdAt)}</td><td>${c.emailBlacklisted?'<span class="pill">bloqueado</span>':'<span class="pill">ativo</span>'}</td><td><div class="actions"><button class="btn small" onclick="removeList('${esc(c.email)}')">Remover da lista</button><button class="btn red small" onclick="deleteOne('${esc(c.email)}')">Excluir contato</button></div></td></tr>`).join('');updateBulk()}
async function load(){try{show('Carregando contatos...');const d=await call();contacts=d.contacts||[];render();show(`${contacts.length} contato(s) na lista #${d.listId}.`,'ok')}catch(e){show('Erro: '+e.message,'bad')}}
async function removeList(email){if(!confirm(`Remover ${email} da lista #${listId()}? O contato continuará salvo na Brevo.`))return;try{await call({action:'remove-list',listId:listId(),email});contacts=contacts.filter(c=>c.email!==email);render();show(`${email} removido da lista.`,'ok')}catch(e){show('Erro: '+e.message,'bad')}}window.removeList=removeList;
async function deleteOne(email){if(!confirm(`Excluir ${email} da Brevo? Essa ação apaga o contato inteiro.`))return;try{await call({action:'delete-contact',email});contacts=contacts.filter(c=>c.email!==email);render();show(`${email} excluído da Brevo.`,'ok')}catch(e){show('Erro: '+e.message,'bad')}}window.deleteOne=deleteOne;
window.updateBulk=updateBulk;
$('#loadBtn').onclick=load;
$('#selectAllBtn').onclick=()=>{const boxes=[...document.querySelectorAll('.sel')],all=boxes.length&&boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=!all);updateBulk()};
$('#deleteSelectedBtn').onclick=async()=>{const emails=selected();if(!emails.length)return;if(!confirm(`Excluir ${emails.length} contato(s) da Brevo inteira? Essa ação não pode ser desfeita.`))return;try{show('Excluindo contatos...');const d=await call({action:'delete-many',emails});const deleted=new Set(emails.filter(e=>!(d.failed||[]).some(f=>f.email===e)));contacts=contacts.filter(c=>!deleted.has(c.email));render();show(`${d.deleted||0} contato(s) excluído(s)${d.failed&&d.failed.length?' · '+d.failed.length+' falha(s)':''}.`,d.failed&&d.failed.length?'bad':'ok')}catch(e){show('Erro: '+e.message,'bad')}};
load();
</script></body></html>
