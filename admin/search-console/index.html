<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Google + Instagram | MPMV</title><style>body{margin:0;background:#07101a;color:#edf5fb;font-family:Inter,system-ui,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 24px));margin:24px auto 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,select{border:1px solid #203246;background:#0d1824;color:#edf5fb;border-radius:9px;padding:10px 12px;font-weight:800}.btn{cursor:pointer}.primary{background:#78c8f4;color:#062033;border-color:transparent}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.card{background:#0d1824;border:1px solid #203246;border-radius:14px;padding:15px}.metric{font-size:26px;font-weight:900}.muted{color:#8fa4b8;font-size:12px}.section{background:#0d1824;border:1px solid #203246;border-radius:14px;padding:15px;margin-top:12px;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #203246}.good{color:#46c48a}.error{color:#e46e77}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.top{display:block}}</style></head><body><main class="wrap"><header class="top"><div><h1 id="title">Google Search Console</h1><div id="desc" class="muted">Cliques, impressões, CTR, posição, artigos e consultas do MPMV.</div></div><div class="actions"><select id="property"><option value="website">Site MPMV</option><option value="instagram">Instagram</option></select><select id="days"><option value="7">7 dias</option><option value="28" selected>28 dias</option><option value="30">30 dias</option><option value="90">90 dias</option></select><label id="import" class="btn" style="display:none">Importar CSV<input id="files" type="file" accept=".csv,text/csv" multiple style="display:none"></label><button id="clear" class="btn" style="display:none">Limpar histórico</button><button id="reload" class="btn primary">Atualizar</button><a class="btn" href="/admin/">← App</a></div></header><section class="metrics"><div class="card"><div id="clicks" class="metric">—</div><div class="muted">Cliques</div></div><div class="card"><div id="impressions" class="metric">—</div><div class="muted">Impressões</div></div><div class="card"><div id="ctr" class="metric">—</div><div class="muted">CTR</div></div><div class="card"><div id="position" class="metric">—</div><div class="muted">Posição média</div></div></section><section class="section"><h2 id="pagesTitle">Artigos no Google</h2><div id="pages" class="muted">Aguardando dados.</div></section><section class="section"><h2>Consultas</h2><div id="queries" class="muted">Aguardando dados.</div></section><section class="section"><h2 id="summaryTitle">Resumo dos artigos</h2><div id="summary" class="muted">Aguardando dados.</div></section><div id="status" class="muted" style="margin-top:12px"></div></main><script>const $=s=>document.querySelector(s),STORE='mpmv_gsc_instagram_history_v2';function token(){let t=sessionStorage.getItem('mpmv_admin_token')||'';if(!t){t=prompt('Digite o token do admin MPMV:','')||'';if(t)sessionStorage.setItem('mpmv_admin_token',t)}return t}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function num(v){return Number(v||0).toLocaleString('pt-BR')}function pct(v){return (Number(v||0)*100).toFixed(1)+'%'}function table(rows,title){if(!rows.length)return'<div class="muted">Nenhum dado no período.</div>';return'<table class="table"><thead><tr><th>'+title+'</th><th>CLIQUES</th><th>IMPRESSÕES</th><th>CTR</th><th>POSIÇÃO</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.keys?.[0]||'')+'</td><td class="good">'+num(x.clicks)+'</td><td>'+num(x.impressions)+'</td><td>'+pct(x.ctr)+'</td><td>'+Number(x.position||0).toFixed(1)+'</td></tr>').join('')+'</tbody></table>'}function history(){try{const x=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function csvRows(text){text=String(text||'').replace(/^\uFEFF/,'');const first=(text.split(/\r?\n/).find(x=>x.trim())||''),delim=first.includes(';')?';':first.includes('\t')?'\t':',';const out=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===delim&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>String(v).trim()))out.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>String(v).trim()))out.push(row);return out}function nval(v){let s=String(v??'').trim().replace(/\s/g,'').replace('%','');if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');const n=Number(s);return Number.isFinite(n)?n:0}function parseCsv(name,text){const rows=csvRows(text);if(!rows.length)return null;const h=rows[0].map(x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));const find=names=>{for(const n of names){const i=h.findIndex(x=>x===n||x.includes(n));if(i>=0)return i}return-1};const key=find(['principais consultas','consulta','query','principais posts','top posts','pagina','page','url']),ci=find(['cliques','clicks']),ii=find(['impressoes','impressions']),ct=find(['ctr']),po=find(['posicao','position']);if(key<0||ci<0||ii<0)return null;const type=h[key].includes('consulta')||h[key].includes('query')||name.toLowerCase().includes('consulta')?'queries':'content';return{type,rows:rows.slice(1).map(r=>({keys:[String(r[key]||'').trim()],clicks:nval(r[ci]),impressions:nval(r[ii]),ctr:ct>=0?nval(r[ct]):0,position:po>=0?nval(r[po]):0})).filter(x=>x.keys[0])}}function weighted(rows){let c=0,i=0,p=0;for(const x of rows){c+=x.clicks;i+=x.impressions;p+=x.position*x.impressions}return{clicks:c,impressions:i,ctr:i?c/i:0,position:i?p/i:0}}async function importIg(files){let content=[],queries=[];for(const f of files){const x=parseCsv(f.name,await f.text());if(!x)continue;if(x.type==='queries')queries=x.rows;else content=x.rows}if(!content.length&&!queries.length){alert('Não reconheci os CSVs.');return}const h=history();h.unshift({importedAt:new Date().toISOString(),content,queries,total:weighted(content.length?content:queries)});localStorage.setItem(STORE,JSON.stringify(h.slice(0,12)));renderIg()}function renderIg(){const h=history();$('#title').textContent='Instagram no Google';$('#desc').textContent='Dados importados do Search Console e guardados no MPMV OS.';$('#days').style.display='none';$('#reload').style.display='none';$('#import').style.display='inline-flex';$('#clear').style.display=h.length?'inline-flex':'none';if(!h.length){$('#clicks').textContent='—';$('#impressions').textContent='—';$('#ctr').textContent='—';$('#position').textContent='—';$('#pages').innerHTML='<div class="muted">Importe os CSVs de Páginas/Posts e Consultas.</div>';$('#queries').textContent='Aguardando importação.';$('#summary').textContent='Até 12 importações ficam guardadas no navegador.';return}const d=h[0];$('#clicks').textContent=num(d.total.clicks);$('#impressions').textContent=num(d.total.impressions);$('#ctr').textContent=pct(d.total.ctr);$('#position').textContent=Number(d.total.position||0).toFixed(1);$('#pages').innerHTML=table(d.content||[],'CONTEÚDO');$('#queries').innerHTML=table(d.queries||[],'CONSULTA');$('#summary').textContent='Última importação: '+new Date(d.importedAt).toLocaleString('pt-BR')+' · Histórico: '+h.length+' importação(ões).'}async function load(){const t=token();if(!t)return;$('#status').textContent='Consultando Search Console...';$('#reload').disabled=true;try{const r=await fetch('/api/guia?action=search-console&days='+encodeURIComponent($('#days').value),{headers:{'x-admin-token':t},cache:'no-store'});const d=await r.json();if(r.status===401){sessionStorage.removeItem('mpmv_admin_token');throw new Error('Token inválido')}if(!r.ok)throw new Error(d.error||'Falha no Search Console');$('#clicks').textContent=num(d.total.clicks);$('#impressions').textContent=num(d.total.impressions);$('#ctr').textContent=pct(d.total.ctr);$('#position').textContent=Number(d.total.position||0).toFixed(1);$('#pages').innerHTML=table(d.pages||[],'ARTIGO');$('#queries').innerHTML=table(d.queries||[],'CONSULTA');$('#summary').innerHTML='<b>Cliques nos artigos:</b> '+num(d.articleTotals.clicks)+' · <b>Impressões:</b> '+num(d.articleTotals.impressions)+' · <b>CTR:</b> '+pct(d.articleTotals.ctr)+' · <b>Período:</b> '+esc(d.startDate)+' a '+esc(d.endDate);$('#status').textContent='Dados finais do Search Console.'}catch(e){$('#status').innerHTML='<span class="error">Erro: '+esc(e.message)+'</span>'}finally{$('#reload').disabled=false}}function route(){const ig=$('#property').value==='instagram';if(ig)renderIg();else{ $('#title').textContent='Google Search Console';$('#desc').textContent='Cliques, impressões, CTR, posição, artigos e consultas do MPMV.';$('#days').style.display='inline-block';$('#reload').style.display='inline-flex';$('#import').style.display='none';$('#clear').style.display='none';load()}}$('#reload').onclick=load;$('#days').onchange=load;$('#property').onchange=route;$('#files').onchange=e=>importIg(Array.from(e.target.files||[]));$('#clear').onclick=()=>{localStorage.removeItem(STORE);renderIg()};route();</script></body></html>
