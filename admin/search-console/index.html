<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Google Search Console | MPMV</title><style>body{margin:0;background:#07101a;color:#edf5fb;font-family:Inter,system-ui,Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 24px));margin:24px auto 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,select{border:1px solid #203246;background:#0d1824;color:#edf5fb;border-radius:9px;padding:10px 12px;font-weight:800}.primary{background:#78c8f4;color:#062033;border-color:transparent}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.card{background:#0d1824;border:1px solid #203246;border-radius:14px;padding:15px}.metric{font-size:26px;font-weight:900}.muted{color:#8fa4b8;font-size:12px}.section{background:#0d1824;border:1px solid #203246;border-radius:14px;padding:15px;margin-top:12px;overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #203246}.good{color:#46c48a}.error{color:#e46e77}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.metrics{grid-template-columns:1fr 1fr}.top{display:block}}</style></head><body><main class="wrap"><header class="top"><div><h1>Google Search Console</h1><div class="muted">Cliques, impressões, CTR, posição, artigos e consultas do MPMV.</div></div><div class="actions"><select id="days"><option value="7">7 dias</option><option value="28" selected>28 dias</option><option value="30">30 dias</option><option value="90">90 dias</option></select><button id="reload" class="btn primary">Atualizar</button><a class="btn" href="/admin/">← App</a></div></header><section class="metrics"><div class="card"><div id="clicks" class="metric">—</div><div class="muted">Cliques</div></div><div class="card"><div id="impressions" class="metric">—</div><div class="muted">Impressões</div></div><div class="card"><div id="ctr" class="metric">—</div><div class="muted">CTR</div></div><div class="card"><div id="position" class="metric">—</div><div class="muted">Posição média</div></div></section><section class="section"><h2>Artigos no Google</h2><div id="pages" class="muted">Aguardando dados.</div></section><section class="section"><h2>Consultas</h2><div id="queries" class="muted">Aguardando dados.</div></section><section class="section"><h2>Resumo dos artigos</h2><div id="summary" class="muted">Aguardando dados.</div></section><div id="status" class="muted" style="margin-top:12px"></div></main><script>const $=s=>document.querySelector(s);function token(){let t=sessionStorage.getItem('mpmv_admin_token')||'';if(!t){t=prompt('Digite o token do admin MPMV:','')||'';if(t)sessionStorage.setItem('mpmv_admin_token',t)}return t}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function num(v){return Number(v||0).toLocaleString('pt-BR')}function pct(v){return (Number(v||0)*100).toFixed(1)+'%'}function table(rows,title){if(!rows.length)return'<div class="muted">Nenhum dado no período.</div>';return'<table class="table"><thead><tr><th>'+title+'</th><th>CLIQUES</th><th>IMPRESSÕES</th><th>CTR</th><th>POSIÇÃO</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.keys?.[0]||'')+'</td><td class="good">'+num(x.clicks)+'</td><td>'+num(x.impressions)+'</td><td>'+pct(x.ctr)+'</td><td>'+Number(x.position||0).toFixed(1)+'</td></tr>').join('')+'</tbody></table>'}async function load(){const t=token();if(!t)return;$('#status').textContent='Consultando Search Console...';$('#reload').disabled=true;try{const r=await fetch('/api/guia?action=search-console&days='+encodeURIComponent($('#days').value),{headers:{'x-admin-token':t},cache:'no-store'});const d=await r.json();if(r.status===401){sessionStorage.removeItem('mpmv_admin_token');throw new Error('Token inválido')}if(!r.ok)throw new Error(d.error||'Falha no Search Console');$('#clicks').textContent=num(d.total.clicks);$('#impressions').textContent=num(d.total.impressions);$('#ctr').textContent=pct(d.total.ctr);$('#position').textContent=Number(d.total.position||0).toFixed(1);$('#pages').innerHTML=table(d.pages||[],'ARTIGO');$('#queries').innerHTML=table(d.queries||[],'CONSULTA');$('#summary').innerHTML='<b>Cliques nos artigos:</b> '+num(d.articleTotals.clicks)+' · <b>Impressões:</b> '+num(d.articleTotals.impressions)+' · <b>CTR:</b> '+pct(d.articleTotals.ctr)+' · <b>Período:</b> '+esc(d.startDate)+' a '+esc(d.endDate);$('#status').textContent='Dados finais do Search Console.'}catch(e){$('#status').innerHTML='<span class="error">Erro: '+esc(e.message)+'</span>'}finally{$('#reload').disabled=false}}$('#reload').onclick=load;$('#days').onchange=load;if(sessionStorage.getItem('mpmv_admin_token'))load();</script></body></html>
