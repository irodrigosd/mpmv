<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07101a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lead 360 | MPMV OS</title>
<style>
:root{--bg:#07101a;--panel:#0d1824;--panel2:#111f2e;--line:#203246;--txt:#edf5fb;--muted:#8fa4b8;--blue:#78c8f4;--green:#46c48a;--gold:#e7bf69;--red:#e46e77;--purple:#b69cff}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(135deg,#07101a 0%,#0b1826 55%,#07101a 100%);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}a{color:inherit}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);background:rgba(7,16,26,.96);padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:950;font-size:24px;letter-spacing:-.6px;margin:0 10px 28px}.brand b{color:var(--blue)}.nav{display:grid;gap:7px}.nav a{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:11px;text-decoration:none;color:var(--muted);font-weight:750;font-size:14px}.nav a:hover,.nav a.active{background:var(--panel2);color:var(--txt)}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}.main{padding:26px;max-width:1500px;width:100%}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.top h1{margin:0;font-size:30px;letter-spacing:-1px}.top p{margin:6px 0 0;color:var(--muted);font-size:14px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:10px;min-height:40px;padding:0 13px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--blue);color:#062033;border-color:transparent}.card{border:1px solid var(--line);background:rgba(13,24,36,.9);border-radius:16px;padding:18px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.search{flex:1;min-height:44px;border:1px solid var(--line);background:#09141f;color:var(--txt);border-radius:11px;padding:0 14px;font-size:14px;outline:none}.search:focus{border-color:#4e7da1}.split{display:grid;grid-template-columns:minmax(420px,.85fr) minmax(0,1.4fr);gap:15px}.list{max-height:calc(100vh - 180px);overflow:auto}.leadrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 12px;border-bottom:1px solid rgba(32,50,70,.65);cursor:pointer;border-radius:10px}.leadrow:hover,.leadrow.active{background:#102131}.leadrow:last-child{border-bottom:0}.leadrow b{display:block;font-size:14px;margin-bottom:3px}.leadrow small{color:var(--muted)}.date{font-size:11px;color:var(--muted);white-space:nowrap}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:850;margin-top:6px;background:#132638;color:#a9d8f2}.pill.meta{background:#162b3b;color:#86d4ff}.pill.email{background:#312a18;color:#f4cd73}.pill.direct{background:#232833;color:#bdc8d4}.profile.empty{display:flex;align-items:center;justify-content:center;min-height:420px;color:var(--muted);text-align:center}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.head h2{font-size:24px;margin:0 0 5px}.head .email{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.metric{border:1px solid var(--line);background:#09141f;border-radius:13px;padding:13px}.metric strong{display:block;font-size:19px;margin-bottom:4px}.metric span{font-size:10px;color:var(--muted);font-weight:700}.section{margin-top:14px}.section h3{margin:0 0 10px;font-size:14px}.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.stage{border:1px solid var(--line);background:#09141f;border-radius:12px;padding:11px;min-height:78px}.stage.done{border-color:rgba(70,196,138,.55);background:rgba(38,116,81,.12)}.stage.pending{opacity:.55}.stage strong{display:block;font-size:12px;margin-bottom:5px}.stage small{font-size:10px;color:var(--muted);line-height:1.35}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.fact{border:1px solid var(--line);background:#09141f;border-radius:11px;padding:11px}.fact label{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}.fact div{font-size:13px;word-break:break-word}.timeline{display:grid;gap:8px}.event{display:grid;grid-template-columns:90px 1fr;gap:10px;border-left:2px solid #2e5470;padding:6px 0 6px 12px}.event time{font-size:10px;color:var(--muted)}.event b{font-size:12px}.event small{display:block;color:var(--muted);margin-top:2px}.notice{border:1px dashed var(--line);border-radius:11px;padding:12px;color:var(--muted);font-size:12px;line-height:1.45}.good{color:var(--green)}.warn{color:var(--gold)}.bad{color:var(--red)}.loading{padding:30px;text-align:center;color:var(--muted)}.mobilebar{display:none}@media(max-width:980px){.split{grid-template-columns:1fr}.list{max-height:none}.journey{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.shell{display:block}.sidebar{display:none}.main{padding:calc(18px + env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom))}.top{display:block}.top .btn{margin-top:12px}.toolbar{align-items:stretch}.split{display:block}.list{margin-bottom:12px}.leadrow{padding:12px 8px}.profile{padding:14px}.head{display:block}.actions{margin-top:12px}.journey{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr}.mobilebar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#0a1520;border:1px solid var(--line);border-radius:15px;padding:6px;z-index:20}.mobilebar a{text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:800;padding:8px 2px}.mobilebar a b{display:block;color:var(--txt);font-size:16px}.event{grid-template-columns:74px 1fr}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><b>MPMV</b> OS</div><nav class="nav"><a href="/admin/">Visão geral</a><a href="/admin/blog/">Conteúdo / Blog</a><a class="active" href="/admin/leads360/"><span class="dot"></span>Lead 360</a><a href="/leads/">Base de leads</a><a href="/rastreamento/">Rastreamento</a><a href="/curso/">Curso</a></nav></aside>
<main class="main">
<header class="top"><div><h1>Lead 360</h1><p>Origem, anúncio, navegação e estágio do funil em uma única ficha.</p></div><a class="btn" href="/admin/">← Central MPMV</a></header>
<div class="toolbar"><input id="search" class="search" placeholder="Buscar por nome, e-mail, campanha ou anúncio"><button id="reload" class="btn primary">Atualizar</button></div>
<div class="split">
<section class="card list"><div id="leadList" class="loading">Carregando leads...</div></section>
<section id="profile" class="card profile empty">Selecione um lead para abrir a ficha 360.</section>
</div>
</main></div>
<nav class="mobilebar"><a href="/admin/"><b>⌂</b>Início</a><a href="/admin/blog/"><b>✎</b>Blog</a><a href="/admin/leads360/"><b>◎</b>Leads</a><a href="/rastreamento/"><b>↗</b>Tráfego</a></nav>
<script>
const $=s=>document.querySelector(s);let leads=[],sessions=[],rows=[],selected='';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function token(){let t=sessionStorage.getItem('mpmv_admin_token')||'';if(!t){t=prompt('Digite o token do admin MPMV:','')||'';if(t)sessionStorage.setItem('mpmv_admin_token',t);}return t;}
function fmt(v,full=false){if(!v)return'—';const d=new Date(v);if(isNaN(d))return'—';return d.toLocaleString('pt-BR',full?{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}:{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function sec(n){n=Number(n)||0;if(n<60)return n+'s';return Math.floor(n/60)+'m '+(n%60)+'s';}
function src(s){s=String(s||'direct');if(/sendibt|brevo/i.test(s))return'E-mail';if(/meta|facebook|instagram/i.test(s))return'Meta Ads';if(/google|bing|organic/i.test(s))return'Orgânico';if(/direct|direto/i.test(s))return'Direto';return s;}
function sourceClass(v){v=src(v);return v==='Meta Ads'?'meta':v==='E-mail'?'email':'direct';}
function normalizeEmail(v){return String(v||'').trim().toLowerCase();}
function sessionFor(email){const e=normalizeEmail(email);return sessions.filter(s=>normalizeEmail(s.email)===e).sort((a,b)=>new Date(b.convertedAt||b.updatedAt||0)-new Date(a.convertedAt||a.updatedAt||0));}
function courseSeen(s){const paths=[s.landingPage,s.currentPage].concat((s.pages||[]).map(p=>p.path)).filter(Boolean);return paths.some(p=>String(p).split('?')[0].replace(/\/$/,'')==='/curso');}
function buildRows(){rows=leads.map(l=>{const ss=sessionFor(l.email),primary=ss[0]||null;return{lead:l,sessions:ss,primary,search:[l.name,l.email,primary&&primary.source,primary&&primary.campaign,primary&&primary.ad].filter(Boolean).join(' ').toLowerCase()};});}
function renderList(){const q=$('#search').value.trim().toLowerCase();const list=rows.filter(r=>!q||r.search.includes(q));if(!list.length){$('#leadList').innerHTML='<div class="notice">Nenhum lead encontrado.</div>';return;}$('#leadList').innerHTML=list.map(r=>{const l=r.lead,s=r.primary;return `<div class="leadrow ${normalizeEmail(l.email)===selected?'active':''}" data-email="${esc(l.email)}"><div><b>${esc(l.name||'Sem nome')}</b><small>${esc(l.email)}</small><br><span class="pill ${sourceClass(s&&s.source)}">${esc(s?src(s.source):'Sem origem vinculada')}</span></div><div class="date">${esc(fmt(l.createdAt))}</div></div>`;}).join('');document.querySelectorAll('.leadrow').forEach(el=>el.onclick=()=>selectLead(el.dataset.email));}
function selectLead(email){selected=normalizeEmail(email);const r=rows.find(x=>normalizeEmail(x.lead.email)===selected);if(!r)return;history.replaceState(null,'','?email='+encodeURIComponent(r.lead.email));renderList();renderProfile(r);}
function stage(done,title,desc){return `<div class="stage ${done?'done':'pending'}"><strong>${done?'✓ ':''}${esc(title)}</strong><small>${esc(desc)}</small></div>`;}
function renderProfile(r){const l=r.lead,ss=r.sessions,s=ss[0]||null,clickedCourse=ss.some(courseSeen);const pages=s?(s.pages||[]):[];const source=s?src(s.source):'Não identificado';const originDetail=s?[s.campaign,s.ad].filter(Boolean).join(' · '):'';const visit=!!s,guide=true,emailStage=false,purchase=false;$('#profile').className='card profile';$('#profile').innerHTML=`<div class="head"><div><h2>${esc(l.name||'Sem nome')}</h2><div class="email">${esc(l.email)}</div></div><div class="actions"><a class="btn" href="mailto:${encodeURIComponent(l.email)}">Enviar e-mail</a><a class="btn" href="/rastreamento/">Abrir rastreamento</a></div></div>
<div class="metrics"><div class="metric"><strong>${esc(source)}</strong><span>Origem</span></div><div class="metric"><strong>${s?esc(sec(s.activeSeconds)):'—'}</strong><span>Tempo ativo</span></div><div class="metric"><strong>${s?Number(s.pageViews||1):'—'}</strong><span>Páginas vistas</span></div><div class="metric"><strong>${ss.length}</strong><span>Sessões vinculadas</span></div></div>
<div class="section"><h3>Funil</h3><div class="journey">${stage(visit,'Visitou','Sessão identificada')}${stage(guide,'Baixou o Guia',fmt(l.createdAt,true))}${stage(emailStage,'Abriu e-mail','Ainda não integrado à Brevo')}${stage(clickedCourse,'Clicou no curso',clickedCourse?'Visitou /curso/':'Nenhuma visita detectada')}${stage(purchase,'Comprou','Venda ainda não integrada')}</div></div>
<div class="section"><h3>Atribuição</h3>${s?`<div class="facts"><div class="fact"><label>Origem</label><div>${esc(source)}</div></div><div class="fact"><label>Campanha</label><div>${esc(s.campaign||'—')}</div></div><div class="fact"><label>Anúncio</label><div>${esc(s.ad||'—')}</div></div><div class="fact"><label>Conjunto</label><div>${esc(s.adset||s.term||'—')}</div></div><div class="fact"><label>Landing page</label><div>${esc(s.landingPage||'/')}</div></div><div class="fact"><label>Dispositivo</label><div>${esc([s.device,s.browser].filter(Boolean).join(' · ')||'—')}</div></div></div>`:`<div class="notice">Esse lead existe na base, mas não possui uma sessão rastreada vinculada ao e-mail. Isso acontece principalmente com leads capturados antes do Lead 360 entrar em operação.</div>`}</div>
<div class="section"><h3>Jornada</h3>${s&&pages.length?`<div class="timeline">${pages.map(p=>`<div class="event"><time>${esc(fmt(p.at))}</time><div><b>${esc(p.path||'/')}</b><small>Página visitada</small></div></div>`).join('')}</div>`:(s?`<div class="timeline"><div class="event"><time>${esc(fmt(s.startedAt||s.createdAt))}</time><div><b>${esc(s.landingPage||'/')}</b><small>Entrada da sessão</small></div></div></div>`:'<div class="notice">Sem jornada disponível.</div>')}</div>
<div class="section"><h3>Dados do contato</h3><div class="facts"><div class="fact"><label>Cadastro</label><div>${esc(fmt(l.createdAt,true))}</div></div><div class="fact"><label>Status</label><div class="${l.emailBlacklisted?'bad':'good'}">${l.emailBlacklisted?'Bloqueado':'Ativo'}</div></div><div class="fact"><label>ID Brevo</label><div>${esc(l.id||'—')}</div></div><div class="fact"><label>Última atividade</label><div>${esc(s?fmt(s.updatedAt||s.convertedAt||s.startedAt,true):fmt(l.modifiedAt,true))}</div></div></div></div>${originDetail?`<div class="section"><div class="notice"><b>Atribuição principal:</b> ${esc(originDetail)}</div></div>`:''}`;}
async function load(){const t=token();if(!t)return;$('#reload').disabled=true;$('#reload').textContent='Atualizando...';try{const h={'x-admin-token':t};const [lr,tr]=await Promise.all([fetch('/api/leads?limit=500',{headers:h,cache:'no-store'}),fetch('/api/rastreamento?days=90&limit=1000',{headers:h,cache:'no-store'})]);if(lr.status===401||tr.status===401){sessionStorage.removeItem('mpmv_admin_token');throw new Error('Token inválido. Recarregue a página.');}const ld=await lr.json(),td=await tr.json();if(!lr.ok)throw new Error(ld.message||ld.error||'Falha ao carregar leads');if(!tr.ok)throw new Error(td.message||td.error||'Falha ao carregar rastreamento');leads=Array.isArray(ld.contacts)?ld.contacts:[];sessions=Array.isArray(td.sessions)?td.sessions:[];buildRows();renderList();const target=new URLSearchParams(location.search).get('email');if(target&&rows.some(r=>normalizeEmail(r.lead.email)===normalizeEmail(target)))selectLead(target);else if(rows[0])selectLead(rows[0].lead.email);}catch(e){$('#leadList').innerHTML='<div class="notice bad">Erro: '+esc(e.message)+'</div>';$('#profile').className='card profile empty';$('#profile').textContent='Não foi possível carregar o Lead 360.';}finally{$('#reload').disabled=false;$('#reload').textContent='Atualizar';}}
$('#search').addEventListener('input',renderList);$('#reload').addEventListener('click',load);load();
</script>
</body></html>
