<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads da Aula | MPMV</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon-mpmv.png?v=3"><style>:root{--bg:#f4f9fb;--ink:#16344a;--muted:#6e7f8c;--line:#dbe7ed;--blue:#168fbd;--green:#2d9a65;--red:#b92d39}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:900}.top a{color:var(--blue);font-weight:800}.card{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 14px 40px rgba(31,59,75,.06)}h1{margin:0 0 6px}.muted{color:var(--muted)}.auth{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:18px}.auth input,.search{width:100%;min-height:48px;border:1px solid #c8dbe4;border-radius:9px;padding:0 13px;font:inherit}.primary,.secondary{min-height:48px;border-radius:9px;padding:0 18px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--ink);color:#fff}.secondary{border:1px solid #bfd3dd;background:#fff;color:var(--ink)}.status{margin-top:10px;font-weight:800}.status.ok{color:var(--green)}.status.error{color:var(--red)}.hidden{display:none!important}.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:22px 0 16px}.stats{display:flex;gap:28px;flex-wrap:wrap;margin:12px 0 18px}.stat strong{font-size:1.5rem}.stat span{display:block;color:var(--muted);font-size:.82rem}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;background:#f7fbfd;color:#5d7482}tr:last-child td{border-bottom:0}.ok{color:var(--green);font-weight:800}.error{color:var(--red);font-weight:800}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:#eef7fb;font-size:.78rem;font-weight:900}.note{margin:0;color:var(--muted);font-size:.9rem}@media(max-width:680px){.top,.auth,.toolbar{display:grid;grid-template-columns:1fr}.card{padding:18px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">MPMV — Leads da Aula</div><a href="/leads">← Painel geral</a></header><section class="card"><h1>Leads da Aula ao Vivo</h1><p class="note">Lista própria da aula. O painel sincroniza os inscritos identificados pela inscrição da Aula ao Vivo MPMV.</p><div class="auth"><input id="token" type="password" placeholder="Token administrativo" autocomplete="off"><button id="load" class="primary">CARREGAR LISTA</button></div><div id="status" class="status"></div></section><section id="panel" class="card hidden"><div class="toolbar"><input id="search" class="search" type="search" placeholder="Buscar por nome ou e-mail"><button id="csv" class="secondary">EXPORTAR CSV</button></div><div class="stats"><div class="stat"><strong id="total">0</strong><span>Leads da aula</span></div><div class="stat"><strong id="active">0</strong><span>Ativos</span></div><div class="stat"><strong id="blocked">0</strong><span>Bloqueados</span></div></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Inscrição</th><th>Etapa</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>(function(){const token=document.getElementById('token'),status=document.getElementById('status'),panel=document.getElementById('panel'),search=document.getElementById('search'),rows=document.getElementById('rows'),total=document.getElementById('total'),active=document.getElementById('active'),blocked=document.getElementById('blocked');let contacts=[];try{token.value=sessionStorage.getItem('mpmv-leads-token')||''}catch(e){}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(v){if(!v)return '—';try{return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(v))}catch(e){return v}}function setStatus(t,c){status.textContent=t;status.className='status '+(c||'')}function render(){const q=search.value.toLowerCase().trim(),list=q?contacts.filter(x=>(x.name+' '+x.email).toLowerCase().includes(q)):contacts;total.textContent=contacts.length;active.textContent=contacts.filter(x=>x.status==='Ativo').length;blocked.textContent=contacts.filter(x=>x.status==='Bloqueado').length;rows.innerHTML=list.map(x=>'<tr><td><strong>'+esc(x.name||'—')+'</strong></td><td>'+esc(x.email||'—')+'</td><td>'+esc(date(x.registeredAt||x.createdAt))+'</td><td><span class="badge">'+esc(x.stage||'welcome')+'</span></td><td class="'+(x.status==='Ativo'?'ok':'error')+'">'+esc(x.status)+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">Nenhum lead encontrado.</td></tr>'}async function load(){const t=token.value.trim();if(!t){setStatus('Informe o token administrativo.','error');return}const btn=document.getElementById('load');btn.disabled=true;setStatus('Sincronizando a lista da aula...');try{const r=await fetch('/api/aula-17-09?action=admin',{headers:{'x-admin-token':t}}),d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));contacts=d.contacts||[];panel.classList.remove('hidden');try{sessionStorage.setItem('mpmv-leads-token',t)}catch(e){}render();setStatus('Lista atualizada: '+contacts.length+' leads.','ok')}catch(e){panel.classList.add('hidden');setStatus(e.message==='unauthorized'?'Token incorreto.':'Não foi possível carregar: '+e.message,'error')}finally{btn.disabled=false}}document.getElementById('load').onclick=load;search.addEventListener('input',render);document.getElementById('csv').onclick=function(){const data=[['Nome','E-mail','Inscrição','Etapa','Status']].concat(contacts.map(x=>[x.name||'',x.email||'',x.registeredAt||x.createdAt||'',x.stage||'',x.status||''])),csv='\ufeff'+data.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='leads-aula-mpmv.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};})();</script></body></html>
