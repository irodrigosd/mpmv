  <text x="165" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#143d55">ATENÇÃO</text>
  <text x="165" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#143d55">PROVA</text>
  <text x="165" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">OFERTA</text>
  <text x="165" y="324" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#09243a">AÇÃO</text>
