<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Persuasão para Infoprodutores</title>
<desc id="desc">Capa MPMV com funil, prova, oferta e conversão</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fcff"/>
    <stop offset="58%" stop-color="#e8f7ff"/>
    <stop offset="100%" stop-color="#c9ebff"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0b6fa4"/>
    <stop offset="100%" stop-color="#62bdf0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16354a" flood-opacity="0.14"/>
  </filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1080" cy="80" r="210" fill="#ffffff" opacity="0.45"/>
<circle cx="1030" cy="560" r="250" fill="#8fd3ff" opacity="0.18"/>
<rect x="64" y="58" width="1072" height="514" rx="34" fill="#fff" filter="url(#shadow)"/>
<text x="112" y="135" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0874ad" letter-spacing="3">MPMV • MAIS PERSUASÃO, MAIS VENDAS</text>
<text x="112" y="230" font-family="Arial,sans-serif" font-size="66" font-weight="800" fill="#09243a">Persuasão para</text>
<text x="112" y="306" font-family="Arial,sans-serif" font-size="66" font-weight="800" fill="#09243a">Infoprodutores</text>
<text x="112" y="365" font-family="Arial,sans-serif" font-size="25" fill="#466477">Público • Prova • Oferta • Autoridade • CTA</text>
<rect x="112" y="425" width="410" height="64" rx="18" fill="url(#accent)"/>
<text x="317" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">DA MENSAGEM À CONVERSÃO</text>
<g transform="translate(690 145)">
  <rect x="0" y="0" width="330" height="330" rx="30" fill="#eef8ff" stroke="#c8dfec" stroke-width="2"/>
  <path d="M56 62 H274 L236 126 H94 Z" fill="#bce7ff"/>
  <path d="M94 142 H236 L208 202 H122 Z" fill="#72c8f4"/>
  <path d="M122 218 H208 L184 270 H146 Z" fill="#0b79b4"/>
  <circle cx="165" cy="294" r="18" fill="#09243a"/>
