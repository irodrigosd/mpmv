ans-serif" font-size="14">você procura?</text><rect x="92" y="208" width="216" height="58" rx="16" fill="#d4a94f"/><text x="109" y="243" fill="#17120f" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Quero aumentar as vendas</text><rect x="22" y="286" width="242" height="82" rx="16" fill="#29231f"/><text x="38" y="316" fill="#eee7df" font-family="Arial,Helvetica,sans-serif" font-size="14">Entendi. Qual é o seu</text><text x="38" y="338" fill="#eee7df" font-family="Arial,Helvetica,sans-serif" font-size="14">principal desafio hoje?</text><circle cx="50" cy="402" r="6" fill="#8a7f76"/><circle cx="70" cy="402" r="6" fill="#8a7f76"/><circle cx="90" cy="402" r="6" fill="#8a7f76"/></g><text x="70" y="615" fill="#c9a24c" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="3">MPMV — MAIS PERSUASÃO, MAIS VENDAS</text></svg>