-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#09243a">MAIS VENDAS</text></g><g filter="url(#shadow)" transform="translate(705 95)"><rect width="360" height="500" rx="46" fill="#0b1723"/><rect x="18" y="18" width="324" height="464" rx="34" fill="#ffffff"/><rect x="114" y="31" width="132" height="27" rx="14" fill="#0b1723"/><text x="45" y="96" font-family="Arial,sans-serif" font-size="22" font-weight="900" fill="#09243a">Reels</text><rect x="38" y="122" width="284" height="166" rx="24" fill="#e7f5ff"/><circle cx="180" cy="205" r="47" fill="url(#accent)"/><path d="M166 181l42 24-42 24z" fill="#fff"/><g transform="translate(-125 252)"><g><rect width="190" height="110" rx="20" fill="#fff" stroke="#c9deeb" stroke-width="2"/><text x="18" y="28" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#2c8fff">01</text><text x="18" y="56" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#09243a">Pare de começar</text><text x="18" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#09243a">seu Reels assim</text></g><g transform="translate(205 12)"><rect width="190" height="110" rx="20" fill="#fff" stroke="#c9deeb" stroke-width="2"/><text x="18" y="28" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#2c8fff">02</text><text x="18" y="56" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#09243a">O erro que derruba</text><text x="18" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#09243a">sua retenção</text></g><g transform="translate(410 24)"><rect width="190" height="110" rx="20" fill="#fff" stroke="#c9deeb" stroke-width="2"/><text x="18" y="28" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#2c8fff">03</text><text x="18" y="56" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#09243a">Se você vende,</text><text x="18" y="80" font-family="Arial,sans-serif" font-size="18" font-weight