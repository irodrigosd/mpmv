<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Nutrição de leads</title><desc id="desc">Sequência de mensagens entre primeiro contato e oferta</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b0b0b"/><stop offset="1" stop-color="#241012"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#f0d07a"/><stop offset=".58" stop-color="#bd8125"/><stop offset="1" stop-color="#8c5616"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><circle cx="120" cy="110" r="170" fill="#c99c3d" opacity=".12"/><circle cx="1090" cy="590" r="210" fill="#a51f27" opacity=".15"/><text x="70" y="92" fill="#e0bc65" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="3">LEADS + CONVERSÃO</text><text x="70" y="188" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800">Nutrição de leads</text><text x="70" y="242" fill="#d3cdc6" font-family="Arial,Helvetica,sans-serif" font-size="30">do primeiro contato até a oferta</text><g transform="translate(690 120)"><rect x="0" y="0" width="420" height="100" rx="18" fill="#111" stroke="#3d342d"/><circle cx="54" cy="50" r="28" fill="url(#gold)"/><text x="54" y="59" text-anchor="middle" fill="#111" font-family="Arial" font-size="24" font-weight="800">1</text><text x="104" y="42" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Contexto</text><text x="104" y="70" fill="#9f978f" font-family="Arial" font-size="17">entender o problema</text><rect x="0" y="120" width="420" height="100" rx="18" fill="#111" stroke="#3d342d"/><circle cx="54" cy="170" r="28" fill="url(#gold)"/><text x="54" y="179" text-anchor="middle" fill="#111" font-family="Arial" font-size="24" font-weight="800">2</text><text x="104" y="162" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Conteúdo</text><text x="104" y="190" fill="#9f978f" font-family="Arial" font-size="17">criar entendimento</text><rect x="0" y="240" width="420" height="100" rx="18" fill="#111" stroke="#3d342d"/><circle cx="54" cy="290" r="28" fill="url(#gold)"/><text x="54" y="299" text-anchor="middle" fill="#111" font-family="Arial" font-size="24" font-weight="800">3</text><text x="104" y="282" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Prova</text><text x="104" y="310" fill="#9f978f" font-family="Arial" font-size="17">reduzir dúvida</text><rect x="0" y="360" width="420" height="100" rx="18" fill="#111" stroke="#3d342d"/><circle cx="54" cy="410" r="28" fill="url(#gold)"/><text x="54" y="419" text-anchor="middle" fill="#111" font-family="Arial" font-size="24" font-weight="800">4</text><text x="104" y="402" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Oferta</text><text x="104" y="430" fill="#9f978f" font-family="Arial" font-size="17">conduzir a próxima ação</text></g><rect x="70" y="530" width="500" height="72" rx="36" fill="url(#gold)"/><text x="320" y="576" text-anchor="middle" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900">INTERESSE → DECISÃO</text><text x="70" y="635" fill="#d1a447" font-family="Arial" font-size="19" font-weight="700">MPMV — Mais Persuasão, Mais Vendas</text></svg>