<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Efeito de enquadramento</title><desc id="d">A mesma informação apresentada como ganho e como perda</desc><rect width="1200" height="675" fill="#111111"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#a51f27"/><stop offset=".5" stop-color="#e25c2d"/><stop offset="1" stop-color="#d1a447"/></linearGradient></defs><rect x="55" y="55" width="1090" height="565" rx="34" fill="#171717" stroke="#333"/><text x="105" y="128" fill="#d1a447" font-size="25" font-family="Arial" font-weight="700">EFEITO DE ENQUADRAMENTO</text><text x="105" y="188" fill="#fff" font-size="49" font-family="Arial" font-weight="800">Mesmos fatos. Leituras diferentes.</text><g font-family="Arial"><rect x="105" y="260" width="425" height="220" rx="25" fill="#222" stroke="#555"/><text x="317" y="322" text-anchor="middle" fill="#d1a447" font-size="24" font-weight="800">GANHO</text><text x="317" y="382" text-anchor="middle" fill="#fff" font-size="42" font-weight="900">90% de sucesso</text><text x="317" y="432" text-anchor="middle" fill="#bdb7af" font-size="19">foco no resultado positivo</text><rect x="670" y="260" width="425" height="220" rx="25" fill="#222" stroke="#555"/><text x="882" y="322" text-anchor="middle" fill="#e25c2d" font-size="24" font-weight="800">PERDA</text><text x="882" y="382" text-anchor="middle" fill="#fff" font-size="42" font-weight="900">10% de fracasso</text><text x="882" y="432" text-anchor="middle" fill="#bdb7af" font-size="19">foco no resultado negativo</text><path d="M545 370 H655" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/><text x="600" y="348" text-anchor="middle" fill="#d1a447" font-size="18" font-weight="700">MESMA MATEMÁTICA</text><text x="105" y="555" fill="#a9a39b" font-size="22">Enquadrar ajuda a compreender. Distorcer impede uma decisão informada.</text></g></svg>