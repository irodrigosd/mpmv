name: Sync blog inventory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Merge all blog inventories
        run: |
          python - <<'PY'
          import json, glob
          from pathlib import Path

          canonical = Path('data/blog-posts.json')
          primary = json.loads(canonical.read_text(encoding='utf-8'))
          files = sorted(glob.glob('data/blog-posts-*.json')) + ['data/blog-posts-extra.json']
          merged = {p.get('slug'): p for p in primary if isinstance(p, dict) and p.get('slug')}
          for name in files:
              path = Path(name)
              if not path.exists():
                  continue
              try:
                  raw = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if not isinstance(raw, list):
                  continue
              for p in raw:
                  if not isinstance(p, dict) or not p.get('slug'):
                      continue
                  slug = p['slug']
                  if slug not in merged:
                      merged[slug] = p
                      continue
                  current = merged[slug]
                  incoming_updated = p.get('updatedAt')
                  current_updated = current.get('updatedAt')
                  if incoming_updated and (not current_updated or incoming_updated >= current_updated):
                      merged[slug] = {**current, **p}
          result = list(merged.values())
          canonical.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Canonical inventory: {len(result)} articles')
          PY

      - name: Commit consolidated inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/blog-posts.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: consolidate blog inventory'
          git push
