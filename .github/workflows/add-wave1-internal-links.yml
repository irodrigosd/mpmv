name: Adicionar links internos da onda 1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-wave1-internal-links.py'
      - '.github/workflows/add-wave1-internal-links.yml'

permissions:
  contents: write

jobs:
  add-links:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inserir links internos da onda 1
        run: python scripts/add-wave1-internal-links.py
      - name: Publicar alterações
        run: |
          if git diff --quiet -- blog/; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "mpmv-bot"
          git config user.email "120876080+irodrigosd@users.noreply.github.com"
          git add blog/
          git commit -m "seo: links internos da onda 1"
          git push
