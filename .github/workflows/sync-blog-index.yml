name: Sync MPMV blog index

on:
  push:
    paths:
      - '.mpmv-blog-index-sync'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing blog entry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/blog-posts.json')
          posts = json.loads(p.read_text(encoding='utf-8'))
          slug = 'blocos-de-persuasao-no-dia-a-dia'
          if not any(x.get('slug') == slug for x in posts):
              posts.append({
                  'id': 'blocos-de-persuasao-no-dia-a-dia-2026-09-14',
                  'title': 'Como usar blocos de persuasão no dia a dia: 7 aplicações práticas',
                  'seoTitle': 'Blocos de Persuasão no Dia a Dia: 7 Aplicações Práticas | MPMV',
                  'metaDescription': 'Aprenda como usar blocos de persuasão no dia a dia em posts, Reels, Stories, e-mails, mensagens e páginas de vendas sem transformar sua comunicação em uma fórmula pronta.',
                  'focusKeyphrase': 'blocos de persuasão no dia a dia',
                  'secondaryKeyphrases': ['blocos de persuasão', 'aplicações de persuasão', 'copywriting no dia a dia'],
                  'slug': slug,
                  'url': '/blog/blocos-de-persuasao-no-dia-a-dia/',
                  'file': 'blog/blocos-de-persuasao-no-dia-a-dia/index.html',
                  'status': 'published',
                  'category': 'Copywriting + Persuasão + Conteúdo',
                  'publishedAt': '2026-09-14',
                  'author': 'Rodrigo Castro',
                  'deletable': True,
                  'cover': 'https://images.unsplash.com/photo-1743796055651-41c743ff2465?auto=format&fit=crop&fm=jpg&q=82&w=1600',
                  'coverImage': 'https://images.unsplash.com/photo-1743796055651-41c743ff2465?auto=format&fit=crop&fm=jpg&q=82&w=1600',
                  'coverAlt': 'Pessoa trabalhando em notebook e escrevendo em um caderno',
                  'batchOrder': 999
              })
              p.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print('Blog entry added.')
          else:
              print('Blog entry already exists.')
          PY
      - name: Commit index update and remove sync files
        run: |
          rm -f .mpmv-blog-index-sync .github/workflows/sync-blog-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/blog-posts.json .mpmv-blog-index-sync .github/workflows/sync-blog-index.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'fix: register blocks of persuasion article in blog index'
            git push
          fi
